<header>
  <div class="wrap header-inner">
    <a class="logo" href="./index.html" aria-label="ALPACA TOOLS 홈">
      <img src="./assets/logo.png" alt="ALPACA TOOLS 로고">
      ALPACA TOOLS
    </a>

    <nav aria-label="주요 메뉴" id="site-nav">
      <a href="./about.html">소개</a>
      <a href="./tools.html">도구</a>
      <a href="./notice.html">공지사항</a>
      <a class="nav-github" href="https://github.com/alpaca100-kor/AlpacaTools" target="_blank" rel="noopener">GitHub ↗</a>
    </nav>

    <a
      class="gh-btn"
      href="https://github.com/alpaca100-kor/AlpacaTools"
      target="_blank"
      rel="noopener"
    >
      GitHub ↗
    </a>

    <button
      class="menu-toggle"
      id="menu-toggle"
      type="button"
      aria-label="메뉴 열기"
      aria-expanded="false"
      aria-controls="site-nav"
    >
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
<script>
(function () {
  var toggle = document.getElementById("menu-toggle");
  var nav = document.getElementById("site-nav");

  // 현재 페이지에 해당하는 nav 링크에 active 클래스를 자동으로 부여합니다.
  // (헤더가 모든 페이지에서 동일한 HTML을 쓰기 때문에 페이지별로 직접 표시할 수 없어 스크립트로 처리)
  var current = (location.pathname.split("/").pop() || "index.html");
  nav.querySelectorAll("a:not(.nav-github)").forEach(function (a) {
    var target = a.getAttribute("href").split("#")[0].replace("./", "") || "index.html";
    if (target === current) a.classList.add("active");
  });

  // 모바일 화면에서 햄버거 버튼으로 메뉴를 열고 닫습니다.
  if (toggle && nav) {
    toggle.addEventListener("click", function () {
      var isOpen = nav.classList.toggle("nav-open");
      toggle.classList.toggle("is-active", isOpen);
      toggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
    });
    nav.querySelectorAll("a").forEach(function (a) {
      a.addEventListener("click", function () {
        nav.classList.remove("nav-open");
        toggle.classList.remove("is-active");
        toggle.setAttribute("aria-expanded", "false");
      });
    });
  }
})();
</script>
