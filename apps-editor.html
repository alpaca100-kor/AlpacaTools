<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>앱 목록 편집기 | ALPACA TOOLS</title>
<link rel="icon" type="image/png" href="./assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<!-- no-ads -->
<style>
.ed-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:0 0 18px}.ed-status{margin-left:auto;font-size:13px;color:var(--muted)}.ed-status[data-dirty="true"]{color:#C0392B;font-weight:700}
.ed-panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin:0 0 28px}.ed-panel h2{font-size:17px;font-weight:800;margin:0 0 16px}
.ed-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.ed-grid .full{grid-column:1/-1}
.ed-field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:0 0 6px}.ed-hint{margin:6px 0 0;font-size:12px;color:var(--muted)}
.ed-field input,.ed-field select{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);font:inherit;font-size:14.5px;padding:10px 12px}
.ed-field input:focus,.ed-field select:focus{border-color:#B9C2F3;outline:none}.ed-field select+input{margin-top:8px}
.ed-actions{display:flex;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap}.ed-err{color:#C0392B;font-size:13px;font-weight:700}
.ed-list{border-top:1px solid var(--line)}.ed-table{width:100%;border-collapse:collapse}.ed-table th,.ed-table td{border-bottom:1px solid var(--line);padding:12px 8px;vertical-align:middle;text-align:left}.ed-table th{background:var(--surface);color:var(--muted);font-size:12.5px;font-weight:700}.ed-table tbody tr:hover{background:var(--surface)}.ed-table tr.bad{background:#FFF3F1}
.ed-table th:first-child,.ed-table td:first-child{width:52px;text-align:center;color:var(--muted);font-size:13px}.ed-table th:nth-child(n+3):nth-child(-n+6),.ed-table td:nth-child(n+3):nth-child(-n+6){text-align:center;font-size:13px}.ed-table th:last-child,.ed-table td:last-child{width:200px;text-align:right;white-space:nowrap}
.ed-badge{display:inline-block;background:var(--accent-tint);color:var(--accent);font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}.ed-date{color:var(--muted);font-size:12.5px;white-space:nowrap}.ed-title{font-size:14.5px;font-weight:700;overflow-wrap:anywhere}
.chip:disabled{opacity:.4;cursor:default}.ed-del:hover{color:#C0392B;border-color:#C0392B}.ed-empty{padding:38px 4px 44px;text-align:center;color:var(--muted);font-size:14px;border-bottom:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:600;z-index:10;max-width:90vw}#toast[data-error="true"]{background:#C0392B;color:#fff}
body[data-drag="true"]{outline:3px dashed var(--accent);outline-offset:-10px}
@media(max-width:700px){.ed-grid{grid-template-columns:1fr}.ed-status{width:100%;margin-left:0}}
</style>
</head>
<body>
<div class="wrap">
<section class="page-hero"><h1>앱 목록 편집기</h1><p>apps.json을 불러와 앱을 추가·수정·삭제하고 표시 순서를 바꾼 뒤, 완성된 파일을 내려받으세요. 쉼표와 따옴표는 자동으로 처리됩니다.</p></section>
<div class="ed-bar">
<button class="search-button" id="btnOpen" type="button">파일 열기</button>
<button class="search-button" id="btnDownload" type="button">apps.json 다운로드</button>
<button class="chip" id="btnCopy" type="button">JSON 복사</button>
<input id="fileInput" type="file" accept=".json,application/json" hidden>
<span class="ed-status" id="status" data-dirty="false">불러온 앱 없음</span>
</div>
<section class="ed-panel" aria-label="앱 입력">
<h2 id="formTitle">새 앱 추가</h2>
<div class="ed-grid">
<div class="ed-field"><label for="fId">ID (id)</label><input id="fId" type="text" autocomplete="off" placeholder="예: ac, aie-web"><p class="ed-hint">영문·숫자·-·_ 만 사용. tools/{id}.html 파일명과 notice.json의 appId에 쓰입니다.</p></div>
<div class="ed-field"><label for="fName">이름 (name)</label><input id="fName" type="text" autocomplete="off" placeholder="알파카 달력"></div>
<div class="ed-field full"><label for="fDesc">설명 (description)</label><input id="fDesc" type="text" autocomplete="off" placeholder="한 줄 설명"></div>
<div class="ed-field"><label for="fIcon">아이콘 (icon)</label><input id="fIcon" type="text" autocomplete="off" placeholder="assets/icons/ac.ico 또는 🧮"><p class="ed-hint">이미지 경로 또는 이모지</p></div>
<div class="ed-field"><label for="fVer">버전 (version)</label><input id="fVer" type="text" autocomplete="off" placeholder="1.0"></div>
<div class="ed-field"><label for="fCat">분류 (category)</label><select id="fCat"></select><input id="fCatNew" type="text" autocomplete="off" placeholder="새 분류 값" hidden></div>
<div class="ed-field"><label for="fPlat">플랫폼 (platform)</label><select id="fPlat"></select><input id="fPlatNew" type="text" autocomplete="off" placeholder="새 플랫폼 값" hidden></div>
<div class="ed-field"><label for="fDate">수정일 (updatedAt)</label><input id="fDate" type="date"></div>
<div class="ed-field"><label for="fTags">태그 (tags)</label><input id="fTags" type="text" autocomplete="off" placeholder="쉼표로 구분: 달력, 날짜"></div>
<div class="ed-field full"><label for="fUrl">웹앱 주소 (url)</label><input id="fUrl" type="url" autocomplete="off" placeholder="웹 앱일 때 실행 주소 (없으면 비워두세요)"></div>
<div class="ed-field full"><label for="fDown">다운로드 주소 (downloadUrl)</label><input id="fDown" type="url" autocomplete="off" placeholder="Windows 프로그램일 때 릴리스 주소 (없으면 비워두세요)"></div>
<div class="ed-field full"><label for="fRepo">소개 글 주소 (repoUrl)</label><input id="fRepo" type="url" autocomplete="off" placeholder="상세 페이지(tools/{id}.html)가 없을 때 이동할 주소"></div>
<div class="ed-field full"><label for="fGit">GitHub 주소 (github)</label><input id="fGit" type="url" autocomplete="off" placeholder="https://github.com/alpaca100-kor/..."></div>
</div>
<div class="ed-actions"><button class="search-button" id="btnSave" type="button">앱 추가</button><button class="chip" id="btnCancel" type="button" hidden>수정 취소</button><span class="ed-err" id="formErr" role="alert"></span></div>
</section>
<section aria-label="앱 목록" style="padding-bottom:60px">
<div class="search-panel" style="margin-bottom:14px"><input id="q" type="search" autocomplete="off" placeholder="이름, ID, 설명으로 찾기" aria-label="앱 찾기"></div>
<div class="result-summary"><span>전체 <b id="cntAll">0</b>건 · 현재 <b id="cntNow">0</b>건</span><span>파일 순서대로 표시 (↑↓로 순서 변경, 검색 중에는 숨김)</span></div>
<div class="ed-list" id="list"></div>
</section>
</div>
<div id="toast" hidden></div>
<script>
const $=id=>document.getElementById(id),NEW="__new",DC=["life","work","dev"],DP=["web","windows"],UL={url:"웹앱 주소(url)",downloadUrl:"다운로드 주소(downloadUrl)",repoUrl:"소개 글 주소(repoUrl)",github:"GitHub 주소(github)"};
let apps=[],meta={},editing=-1,dirty=false,tt;
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#39;")}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function toast(m,err){const t=$("toast");t.textContent=m;t.dataset.error=!!err;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,err?6000:2500)}
function check(a,i){
if(!a||typeof a!=="object")return"앱 정보가 올바르지 않습니다.";
const id=String(a.id||"").trim();
if(!id)return"ID를 입력해주세요.";
if(!/^[A-Za-z0-9_-]+$/.test(id))return"ID는 영문, 숫자, -, _ 만 사용할 수 있습니다.";
if(apps.some((x,j)=>j!==i&&x&&x.id===id))return"이미 사용 중인 ID입니다: "+id;
for(const [k,l] of [["name","이름"],["description","설명"],["icon","아이콘"],["category","분류"],["platform","플랫폼"],["version","버전"]])if(!String(a[k]||"").trim())return l+"을(를) 입력해주세요.";
if(!/^\d{4}-\d{2}-\d{2}$/.test(a.updatedAt||"")||Number.isNaN(new Date(a.updatedAt).getTime()))return"수정일을 선택해주세요.";
for(const k in UL)if(a[k]&&!/^https?:\/\/[^\s]+$/.test(String(a[k]).trim()))return UL[k]+"는 https://로 시작하는 올바른 URL이어야 합니다.";
if(a.tags!=null&&!Array.isArray(a.tags))return"tags는 배열이어야 합니다.";
return""}
function setDirty(v){dirty=v;const s=$("status");s.dataset.dirty=v;s.textContent=apps.length?(v?"저장하지 않은 변경 있음 · ":"")+"총 "+apps.length+"개":"불러온 앱 없음"}
function output(){return JSON.stringify({...meta,apps},null,2)+"\n"}
function vals(k,def){return[...new Set([...def,...apps.map(a=>a&&a[k]).filter(Boolean)])]}
function fillSel(id,list,cur){const s=$(id);s.innerHTML=list.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join("")+'<option value="'+NEW+'">+ 직접 입력…</option>';s.value=list.includes(cur)?cur:list[0];$(id+"New").hidden=true;$(id+"New").value=""}
function selVal(id){return $(id).value===NEW?$(id+"New").value.trim():$(id).value}
function icon(v){v=String(v||"");return/\.(ico|png|svg|jpe?g|webp|gif)$/i.test(v)?'<img src="./'+esc(v.replace(/^\.?\//,""))+'" alt="" width="22" height="22" style="vertical-align:middle;margin-right:8px;border-radius:5px">':'<span style="margin-right:8px">'+esc(v)+'</span>'}
function loadText(text){
let d;try{d=JSON.parse(text)}catch(e){toast("JSON 문법 오류로 열 수 없습니다: "+e.message,true);return false}
if(!d||!Array.isArray(d.apps)){toast('"apps" 배열이 없는 파일입니다. apps.json이 맞는지 확인해주세요.',true);return false}
meta=Object.fromEntries(Object.entries(d).filter(([k])=>k!=="apps"));apps=d.apps;
const bad=apps.filter((a,i)=>check(a,i)).length;
resetForm();render();setDirty(false);
if(bad)toast("확인이 필요한 앱 "+bad+"개가 있습니다. 붉은 배경의 앱을 수정해주세요.",true);else toast(apps.length+"개를 불러왔습니다.");
return true}
function resetForm(c,p){editing=-1;["fId","fName","fDesc","fIcon","fTags","fUrl","fDown","fRepo","fGit"].forEach(id=>$(id).value="");$("fVer").value="1.0";$("fDate").value=today();fillSel("fCat",vals("category",DC),c);fillSel("fPlat",vals("platform",DP),p);$("formTitle").textContent="새 앱 추가";$("btnSave").textContent="앱 추가";$("btnCancel").hidden=true;$("formErr").textContent=""}
function readForm(){const n=v=>v.trim()||null;return{id:$("fId").value.trim(),name:$("fName").value.trim(),description:$("fDesc").value.trim(),icon:$("fIcon").value.trim(),category:selVal("fCat"),platform:selVal("fPlat"),version:$("fVer").value.trim(),updatedAt:$("fDate").value,url:n($("fUrl").value),downloadUrl:n($("fDown").value),repoUrl:n($("fRepo").value),tags:[...new Set($("fTags").value.split(",").map(s=>s.trim()).filter(Boolean))],github:n($("fGit").value)}}
function save(){
const a=readForm(),err=check(a,editing);$("formErr").textContent=err;if(err)return;
if(a.platform==="web"&&!a.url&&!confirm("웹 앱인데 웹앱 주소(url)가 비어 있습니다.\n그래도 저장할까요?"))return;
if(a.platform==="windows"&&!a.downloadUrl&&!confirm("Windows 프로그램인데 다운로드 주소(downloadUrl)가 비어 있습니다.\n그래도 저장할까요?"))return;
const old=editing>-1?apps[editing]:null;
if(old&&old.id!==a.id&&!confirm('ID를 "'+old.id+'"에서 "'+a.id+'"(으)로 바꾸면 notice.json의 appId와 tools/'+old.id+'.html 파일명도 함께 맞춰야 합니다.\n계속할까요?'))return;
if(old)apps[editing]={...old,...a};else apps.unshift(a);
const c=a.category,p=a.platform;resetForm(c,p);render();setDirty(true);
toast(old?"수정했습니다. 다운로드를 눌러 파일을 저장하세요.":"맨 앞에 추가했습니다. 순서는 ↑↓로 바꿀 수 있습니다.");if(!old)$("fId").focus()}
function render(){
const q=$("q").value.trim().toLowerCase(),box=$("list"),n=apps.length;
const rows=apps.map((a,i)=>({a,i})).filter(o=>!q||[o.a.id,o.a.name,o.a.description,o.a.category,o.a.platform].join(" ").toLowerCase().includes(q));
$("cntAll").textContent=n;$("cntNow").textContent=rows.length;
if(!rows.length){box.innerHTML='<div class="ed-empty">'+(n?"조건에 맞는 앱이 없습니다.":"표시할 앱이 없습니다. apps.json을 열거나 위 양식으로 앱을 추가하세요.")+'</div>';return}
box.innerHTML='<table class="ed-table board-table"><thead><tr><th scope="col">순서</th><th scope="col">앱</th><th scope="col">분류</th><th scope="col">플랫폼</th><th scope="col">버전</th><th scope="col">수정일</th><th scope="col">관리</th></tr></thead><tbody>'+rows.map(o=>{const a=o.a,p=check(a,o.i);return'<tr'+(p?' class="bad" title="'+esc(p)+'"':'')+'><td data-label="순서">'+(o.i+1)+'</td><td data-label="앱" data-full="true">'+icon(a.icon)+'<span class="ed-title">'+esc(a.name)+'</span><br><span class="ed-date">'+esc(a.id)+'</span></td><td data-label="분류"><span class="ed-badge">'+esc(a.category)+'</span></td><td data-label="플랫폼">'+esc(a.platform)+'</td><td data-label="버전">'+esc(a.version)+'</td><td class="ed-date" data-label="수정일">'+esc(a.updatedAt)+'</td><td data-label="관리">'+(q?"":'<button class="chip" type="button" data-act="up" data-i="'+o.i+'" aria-label="위로"'+(o.i===0?" disabled":"")+'>↑</button> <button class="chip" type="button" data-act="down" data-i="'+o.i+'" aria-label="아래로"'+(o.i===n-1?" disabled":"")+'>↓</button> ')+'<button class="chip" type="button" data-act="edit" data-i="'+o.i+'">수정</button> <button class="chip ed-del" type="button" data-act="del" data-i="'+o.i+'">삭제</button></td></tr>'}).join("")+'</tbody></table>'}
$("list").addEventListener("click",e=>{
const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const i=Number(b.dataset.i),a=apps[i],act=b.dataset.act;
if(act==="del"){if(!confirm('"'+a.name+'" 앱을 삭제할까요?\nnotice.json의 appId에서 이 앱을 쓰고 있다면 함께 정리해야 합니다.'))return;apps.splice(i,1);if(editing===i)resetForm();else if(editing>i)editing--;render();setDirty(true);toast("삭제했습니다.")}
else if(act==="up"||act==="down"){const j=act==="up"?i-1:i+1;if(j<0||j>=apps.length)return;[apps[i],apps[j]]=[apps[j],apps[i]];if(editing===i)editing=j;else if(editing===j)editing=i;render();setDirty(true)}
else{editing=i;resetForm();editing=i;
const set=(id,v)=>$(id).value=v==null?"":v;
set("fId",a.id);set("fName",a.name);set("fDesc",a.description);set("fIcon",a.icon);set("fVer",a.version);set("fDate",a.updatedAt||today());set("fTags",Array.isArray(a.tags)?a.tags.join(", "):"");set("fUrl",a.url);set("fDown",a.downloadUrl);set("fRepo",a.repoUrl);set("fGit",a.github);
fillSel("fCat",vals("category",DC),a.category);fillSel("fPlat",vals("platform",DP),a.platform);
$("formTitle").textContent="앱 수정";$("btnSave").textContent="수정 저장";$("btnCancel").hidden=false;$("formErr").textContent="";$("formTitle").scrollIntoView({behavior:"smooth",block:"center"});$("fName").focus()}});
["fCat","fPlat"].forEach(id=>$(id).addEventListener("change",()=>{const n=$(id).value===NEW;$(id+"New").hidden=!n;if(n)$(id+"New").focus()}));
$("btnSave").addEventListener("click",save);
$("btnCancel").addEventListener("click",()=>resetForm($("fCat").value,$("fPlat").value));
["fId","fName","fDesc","fIcon","fVer","fCatNew","fPlatNew","fDate","fTags","fUrl","fDown","fRepo","fGit"].forEach(id=>$(id).addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();save()}}));
$("q").addEventListener("input",render);
$("btnOpen").addEventListener("click",()=>$("fileInput").click());
$("fileInput").addEventListener("change",e=>{const f=e.target.files[0];if(f)f.text().then(loadText);e.target.value=""});
$("btnDownload").addEventListener("click",()=>{
if(!apps.length&&!confirm("앱이 없는 빈 파일을 내려받을까요?"))return;
const bad=apps.findIndex((a,i)=>check(a,i));if(bad>-1){toast((bad+1)+"번째 앱에 문제가 있습니다: "+check(apps[bad],bad),true);return}
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([output()],{type:"application/json"}));a.download="apps.json";a.click();URL.revokeObjectURL(a.href);setDirty(false);toast("apps.json을 내려받았습니다. 저장소의 파일을 교체해주세요.")});
$("btnCopy").addEventListener("click",()=>{navigator.clipboard.writeText(output()).then(()=>toast("JSON을 복사했습니다."),()=>toast("복사하지 못했습니다. 다운로드를 이용해주세요.",true))});
["dragenter","dragover"].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();document.body.dataset.drag="true"}));
["dragleave","drop"].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();document.body.dataset.drag="false"}));
document.addEventListener("drop",e=>{const f=e.dataTransfer.files[0];if(f)f.text().then(loadText)});
window.addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});
resetForm();render();
fetch("./apps.json",{cache:"no-store"}).then(r=>r.ok?r.text():Promise.reject()).then(loadText).catch(()=>{});
</script>
</body>
</html>
