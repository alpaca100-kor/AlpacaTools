<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공지사항 | ALPACA TOOLS</title>
<meta name="description" content="ALPACA TOOLS의 출시 및 업데이트 관련 공지사항을 확인하세요.">
<link rel="icon" type="image/png" href="./assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<style>
.notice-hero{padding:58px 0 34px}.notice-hero h1{font-size:clamp(30px,4.2vw,44px);font-weight:800;letter-spacing:-.025em;line-height:1.2;margin:0 0 14px}.notice-hero p{font-size:16px;color:var(--muted);max-width:620px;margin:0}
.notice-search{padding:0 0 28px}.notice-search-panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;align-items:center;gap:8px;max-width:760px}.notice-search-panel:focus-within{border-color:#B9C2F3}.notice-search-panel input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:15px;padding:10px 12px}.notice-search-panel input::placeholder{color:var(--muted)}.notice-clear{border:0;background:transparent;color:var(--muted);cursor:pointer;font:inherit;font-size:13px;font-weight:700;padding:8px 4px}.notice-clear:hover{color:var(--ink)}.notice-search-button{border:0;background:var(--accent);color:#fff;border-radius:9px;padding:11px 18px;cursor:pointer;font:inherit;font-size:14px;font-weight:700;white-space:nowrap}.notice-search-button:hover{background:#2748D6}.notice-search-hint{margin:9px 0 0 4px;color:var(--muted);font-size:12.5px}
.notice-summary{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 0 14px;color:var(--muted);font-size:13px}.notice-summary b{color:var(--ink)}
.notice-list{border-top:1px solid var(--line)}.notice-row{display:flex;align-items:center;gap:18px;min-height:82px;padding:16px 4px;border-bottom:1px solid var(--line);transition:background .15s ease}.notice-row:hover{background:var(--surface)}.notice-date{width:92px;flex-shrink:0;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}.notice-content{flex:1;min-width:0}.notice-title{display:inline-block;color:var(--ink);font-size:15px;font-weight:700;line-height:1.5}.notice-title:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}.notice-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:5px;color:var(--muted);font-size:12px}.notice-app{flex-shrink:0;border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:6px;padding:3px 8px;font-size:11px;font-weight:700}.notice-external{flex-shrink:0;color:var(--accent);font-size:13px;font-weight:700;padding:7px 2px 7px 8px;white-space:nowrap}.notice-external:hover{text-decoration:underline;text-underline-offset:3px}.notice-empty{padding:38px 4px 44px;text-align:center;color:var(--muted);font-size:14px;border-bottom:1px solid var(--line)}
.notice-pagination{display:flex;align-items:center;justify-content:center;gap:6px;padding:24px 0 60px}.notice-pagination button{min-width:34px;height:34px;padding:0 8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer}.notice-pagination button:hover:not(:disabled){border-color:var(--ink);color:var(--ink)}.notice-pagination button[data-active="true"]{background:var(--ink);border-color:var(--ink);color:#fff}.notice-pagination button:disabled{opacity:.4;cursor:default}.notice-pagination .ellipsis{color:var(--muted);padding:0 4px;user-select:none}
.notice-about{border-top:1px solid var(--line);padding:52px 0 64px}.notice-about h2{margin:0 0 14px;font-size:21px;font-weight:800;letter-spacing:-.01em}.notice-about p{max-width:650px;margin:0;color:var(--muted);font-size:14.5px}
@media(max-width:700px){.notice-hero{padding-top:42px}.notice-search-panel{max-width:none}.notice-row{gap:12px;align-items:flex-start}.notice-date{width:76px;padding-top:2px;font-size:11.5px}.notice-title{font-size:14px}.notice-external{font-size:12px}}
@media(max-width:500px){.notice-search-panel{padding:6px;gap:4px}.notice-search-panel input{padding:10px 8px}.notice-clear{font-size:12px}.notice-search-button{padding:10px 12px}.notice-row{display:grid;grid-template-columns:1fr auto;gap:5px 12px;padding:15px 2px}.notice-date{width:auto;grid-column:1}.notice-external{grid-column:2;grid-row:1/span 2;align-self:center}.notice-content{grid-column:1;width:100%}.notice-summary{font-size:12.5px}}
</style>
</head>
<body>
<!--#include header-->
<div class="wrap">
<section class="notice-hero"><h1>공지사항</h1><p>ALPACA TOOLS의 새로운 도구 출시와 주요 업데이트 소식을 확인할 수 있습니다.</p></section>
<section class="notice-search" aria-label="공지사항 검색">
<div class="notice-search-panel"><input id="noticeSearchInput" type="search" autocomplete="off" placeholder="공지사항 제목 또는 도구 이름으로 검색" aria-label="공지사항 검색"><button id="noticeClear" class="notice-clear" type="button" hidden>지우기</button><button id="noticeSearchButton" class="notice-search-button" type="button">검색</button></div>
<p class="notice-search-hint">예: 메모장, 이미지 편집기, 출시, 업데이트</p>
</section>
<section aria-label="공지사항 목록">
<div class="notice-summary" aria-live="polite"><span>전체 <b id="noticeTotalCount">-</b>건 · 현재 <b id="noticeVisibleCount">-</b>건</span><span>최신 공지부터 표시</span></div>
<div class="notice-list" id="noticeList"></div>
<div class="notice-pagination" id="noticePagination" aria-label="공지사항 페이지"></div>
</section>
<section class="notice-about"><h2>ALPACA TOOLS 공지사항</h2><p>새로운 도구의 출시 소식과 기존 도구의 업데이트 내용을 티스토리 블로그에 정리하고 있습니다. 공지사항의 제목을 누르면 해당 게시글을 확인할 수 있습니다.</p></section>
</div>
<!--#include footer-->
<script>
const PER_PAGE=10;
const APP_NAMES={ac:"알파카 달력",ae:"알파카 파일 탐색기","aie-exe":"알파카 이미지 편집기(EXE)","aie-web":"알파카 이미지 편집기(WEB)",an:"알파카 메모장",EdgeCM:"엣지(Edge) 컬렉션 매니저","md-ve":"Markdown Viewer & Editor",pdf2jpg:"PDF to JPG","png-be":"PNG Background Eraser","retirement-age-calc":"은퇴나이 계산기"};
let notices=[],filtered=[],page=1;
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#39;")}
function date(v){const d=new Date(v);if(Number.isNaN(d.getTime()))return v||"";return d.getFullYear()+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getDate()).padStart(2,"0")}
function renderPagination(){const box=document.getElementById("noticePagination"),pages=Math.ceil(filtered.length/PER_PAGE);if(pages<=1){box.innerHTML="";return}const nums=new Set([1,pages,page,page-1,page+1]),out=['<button type="button" data-nav="prev" '+(page===1?"disabled":"")+'>이전</button>'];let prev=0;for(let p=1;p<=pages;p++){if(!nums.has(p))continue;if(prev&&p-prev>1)out.push('<span class="ellipsis">…</span>');out.push('<button type="button" data-page="'+p+'" data-active="'+(p===page)+'">'+p+'</button>');prev=p}out.push('<button type="button" data-nav="next" '+(page===pages?"disabled":"")+'>다음</button>');box.innerHTML=out.join("");box.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>render(Number(b.dataset.page))));const a=box.querySelector('[data-nav="prev"]'),n=box.querySelector('[data-nav="next"]');if(a)a.addEventListener("click",()=>{if(page>1)render(page-1)});if(n)n.addEventListener("click",()=>{if(page<pages)render(page+1)})}
function render(p=1){const list=document.getElementById("noticeList"),pages=Math.max(1,Math.ceil(filtered.length/PER_PAGE));page=Math.min(Math.max(p,1),pages);if(!filtered.length){list.innerHTML='<div class="notice-empty">검색 조건에 맞는 공지사항이 없습니다.</div>';document.getElementById("noticeVisibleCount").textContent="0";document.getElementById("noticePagination").innerHTML="";return}const start=(page-1)*PER_PAGE;list.innerHTML=filtered.slice(start,start+PER_PAGE).map(n=>{const app=APP_NAMES[n.appId]||"";return '<article class="notice-row"><time class="notice-date" datetime="'+esc(n.date)+'">'+esc(date(n.date))+'</time><div class="notice-content"><a class="notice-title" href="'+esc(n.url)+'" target="_blank" rel="noopener">'+esc(n.title)+'</a>'+(app?'<div class="notice-meta"><span class="notice-app">'+esc(app)+'</span></div>':"")+'</div><a class="notice-external" href="'+esc(n.url)+'" target="_blank" rel="noopener">보기 ↗</a></article>'}).join("");document.getElementById("noticeVisibleCount").textContent=String(filtered.length);renderPagination()}
function search(){const q=document.getElementById("noticeSearchInput").value.trim().toLowerCase();filtered=notices.filter(n=>([n.title,n.date,APP_NAMES[n.appId]||""]).join(" ").toLowerCase().includes(q));render(1)}
async function load(){try{const r=await fetch("./notice.json",{cache:"no-store"});if(!r.ok)throw Error("notice.json load failed");const d=await r.json();notices=Array.isArray(d.notices)?[...d.notices].sort((a,b)=>new Date(b.date)-new Date(a.date)):[];filtered=[...notices];document.getElementById("noticeTotalCount").textContent=String(notices.length);render(1)}catch(e){console.error(e);document.getElementById("noticeList").innerHTML='<div class="notice-empty">공지사항을 불러오지 못했습니다. notice.json 파일을 확인해주세요.</div>'}}
function runSearch(){search();document.querySelector('[aria-label="공지사항 목록"]').scrollIntoView({behavior:"smooth",block:"start"})}
document.getElementById("noticeSearchButton").addEventListener("click",runSearch);document.getElementById("noticeSearchInput").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();runSearch()}});document.getElementById("noticeSearchInput").addEventListener("input",()=>{document.getElementById("noticeClear").hidden=!document.getElementById("noticeSearchInput").value;search()});document.getElementById("noticeClear").addEventListener("click",()=>{const i=document.getElementById("noticeSearchInput");i.value="";i.focus();document.getElementById("noticeClear").hidden=true;search()});load();
</script>
</body>
</html>
