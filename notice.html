<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공지사항 | ALPACA TOOLS</title>
<meta name="description" content="ALPACA TOOLS의 출시 및 업데이트 관련 공지사항을 확인하세요.">
<link rel="icon" type="image/png" href="./assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<style>
.notice-list{border-top:1px solid var(--line)}.notice-table{width:100%;border-collapse:collapse;table-layout:auto}.notice-table th,.notice-table td{border-bottom:1px solid var(--line);padding:15px 12px;vertical-align:middle;text-align:left}.notice-table th{background:var(--surface);color:var(--muted);font-size:12.5px;font-weight:700}.notice-table tbody tr:hover{background:var(--surface)}.notice-table th:first-child,.notice-table td:first-child{width:72px;text-align:center}.notice-table th:nth-child(3),.notice-table td:nth-child(3){width:110px;text-align:center}.notice-table th:last-child,.notice-table td:last-child{width:72px;text-align:center}.notice-number{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}.notice-title{color:var(--ink);font-size:14.5px;font-weight:700;line-height:1.5}.notice-title:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}.notice-date{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}.notice-external{color:var(--accent);font-size:13px;font-weight:700;white-space:nowrap}.notice-external:hover{text-decoration:underline;text-underline-offset:3px}.notice-empty{padding:38px 4px 44px;text-align:center;color:var(--muted);font-size:14px;border-bottom:1px solid var(--line)}
@media(max-width:700px){.notice-table th,.notice-table td{padding:13px 8px}.notice-table th:first-child,.notice-table td:first-child{width:54px}.notice-table th:nth-child(3),.notice-table td:nth-child(3){width:88px}.notice-table th:last-child,.notice-table td:last-child{width:58px}.notice-title{font-size:14px}.notice-external{font-size:12px}}
@media(max-width:500px){.notice-table{table-layout:fixed}.notice-table th,.notice-table td{padding:12px 6px}.notice-table th:first-child,.notice-table td:first-child{width:44px}.notice-table th:nth-child(3),.notice-table td:nth-child(3){width:82px}.notice-table th:last-child,.notice-table td:last-child{width:48px}.notice-table .notice-title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.notice-date{font-size:11.5px}}
</style>
</head>
<body>
<!--#include header-->
<div class="wrap">
<section class="page-hero"><h1>공지사항</h1><p>ALPACA TOOLS의 새로운 도구 출시와 주요 업데이트 소식을 확인할 수 있습니다.</p></section>
<section class="search-section search-section--spacious" aria-label="공지사항 검색">
<div class="search-panel"><input id="noticeSearchInput" type="search" autocomplete="off" placeholder="공지사항 제목으로 검색" aria-label="공지사항 검색"><button id="noticeClear" class="search-clear" type="button" hidden>지우기</button><button id="noticeSearchButton" class="search-button" type="button">검색</button></div>
<p class="search-hint">예: 메모장, 이미지 편집기, 출시, 업데이트</p>
</section>
<section aria-label="공지사항 목록">
<div class="result-summary" aria-live="polite"><span>전체 <b id="noticeTotalCount">-</b>건 · 현재 <b id="noticeVisibleCount">-</b>건</span><span>최신 공지부터 표시</span></div>
<div class="notice-list" id="noticeList"></div>
<div class="pagination pagination--spacious" id="noticePagination" aria-label="공지사항 페이지"></div>
</section>
<section class="about"><h2>ALPACA TOOLS 공지사항</h2><p>새로운 도구의 출시 소식과 기존 도구의 업데이트 내용을 티스토리 블로그에 정리하고 있습니다. 공지사항의 제목을 누르면 해당 게시글을 확인할 수 있습니다.</p></section>
</div>
<!--#include footer-->
<script>
const PER_PAGE=10;
let notices=[],filtered=[],page=1;
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#39;")}
function date(v){const d=new Date(v);if(Number.isNaN(d.getTime()))return v||"";return d.getFullYear()+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getDate()).padStart(2,"0")}
function renderPagination(){const box=document.getElementById("noticePagination"),pages=Math.ceil(filtered.length/PER_PAGE);if(pages<=1){box.innerHTML="";return}const nums=new Set([1,pages,page,page-1,page+1]),out=['<button type="button" data-nav="prev" '+(page===1?"disabled":"")+'>이전</button>'];let prev=0;for(let p=1;p<=pages;p++){if(!nums.has(p))continue;if(prev&&p-prev>1)out.push('<span class="page-ellipsis">…</span>');out.push('<button type="button" data-page="'+p+'" data-active="'+(p===page)+'">'+p+'</button>');prev=p}out.push('<button type="button" data-nav="next" '+(page===pages?"disabled":"")+'>다음</button>');box.innerHTML=out.join("");box.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>render(Number(b.dataset.page))));const a=box.querySelector('[data-nav="prev"]'),n=box.querySelector('[data-nav="next"]');if(a)a.addEventListener("click",()=>{if(page>1)render(page-1)});if(n)n.addEventListener("click",()=>{if(page<pages)render(page+1)})}
function render(p=1){const list=document.getElementById("noticeList"),pages=Math.max(1,Math.ceil(filtered.length/PER_PAGE));page=Math.min(Math.max(p,1),pages);if(!filtered.length){list.innerHTML='<div class="notice-empty">검색 조건에 맞는 공지사항이 없습니다.</div>';document.getElementById("noticeVisibleCount").textContent="0";document.getElementById("noticePagination").innerHTML="";return}const start=(page-1)*PER_PAGE;list.innerHTML='<table class="notice-table"><thead><tr><th scope="col">번호</th><th scope="col">제목</th><th scope="col">날짜</th><th scope="col">보기</th></tr></thead><tbody>'+filtered.slice(start,start+PER_PAGE).map(n=>'<tr><td class="notice-number">'+n.number+'</td><td><a class="notice-title" href="'+esc(n.url)+'" target="_blank" rel="noopener">'+esc(n.title)+'</a></td><td class="notice-date"><time datetime="'+esc(n.date)+'">'+esc(date(n.date))+'</time></td><td><a class="notice-external" href="'+esc(n.url)+'" target="_blank" rel="noopener" aria-label="'+esc(n.title)+' 게시글 열기">보기 ↗</a></td></tr>').join('')+'</tbody></table>';document.getElementById("noticeVisibleCount").textContent=String(filtered.length);renderPagination()}
function search(){const q=document.getElementById("noticeSearchInput").value.trim().toLowerCase();filtered=notices.filter(n=>([n.title,n.date].filter(Boolean).join(" ")).toLowerCase().includes(q));render(1)}
async function load(){try{const r=await fetch("./notice.json",{cache:"no-store"});if(!r.ok)throw Error("notice.json load failed");const d=await r.json();notices=Array.isArray(d.notices)?[...d.notices].sort((a,b)=>new Date(b.date)-new Date(a.date)):[];notices=notices.map((n,i)=>({...n,number:notices.length-i}));filtered=[...notices];document.getElementById("noticeTotalCount").textContent=String(notices.length);render(1)}catch(e){console.error(e);document.getElementById("noticeList").innerHTML='<div class="notice-empty">공지사항을 불러오지 못했습니다. notice.json 파일을 확인해주세요.</div>'}}
function runSearch(){search();document.querySelector('[aria-label="공지사항 목록"]').scrollIntoView({behavior:"smooth",block:"start"})}
document.getElementById("noticeSearchButton").addEventListener("click",runSearch);document.getElementById("noticeSearchInput").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();runSearch()}});document.getElementById("noticeSearchInput").addEventListener("input",()=>{document.getElementById("noticeClear").hidden=!document.getElementById("noticeSearchInput").value;search()});document.getElementById("noticeClear").addEventListener("click",()=>{const i=document.getElementById("noticeSearchInput");i.value="";i.focus();document.getElementById("noticeClear").hidden=true;search()});load();
</script>
</body>
</html>
