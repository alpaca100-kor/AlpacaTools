<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="알파카 메모장 - 간단한 메모 작성과 날짜 및 시간 입력, 빠른 입력 기능을 제공하는 Windows 메모장 프로그램">
  <title>알파카 메모장 | ALPACA TOOLS</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .breadcrumb{padding-top:28px;font-size:13px;color:var(--muted)}
    .breadcrumb a:hover{color:var(--ink)}
    .breadcrumb-separator{margin:0 7px;color:#B7B8B5}
    .app-hero{display:flex;align-items:center;gap:24px;padding:30px 0 28px}
    .app-icon{width:88px;height:88px;flex:0 0 88px;object-fit:contain;border:1px solid var(--line);border-radius:20px;background:var(--surface)}
    .app-hero-content{min-width:0}
    .app-hero h1{margin:0 0 8px;font-size:clamp(30px,4.2vw,44px);font-weight:800;letter-spacing:-.025em;line-height:1.2}
    .app-description{margin:0 0 13px;max-width:700px;color:var(--muted);font-size:16px}
    .app-meta{display:flex;flex-wrap:wrap;gap:5px 12px;color:var(--muted);font-size:13px}
    .app-meta-item + .app-meta-item::before{content:"·";margin-right:12px;color:#B7B8B5}
    .app-actions{display:flex;flex-wrap:wrap;gap:9px;padding:0 0 46px}
    .app-button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:13.5px;font-weight:700;transition:background .15s,border-color .15s,color .15s}
    .app-button:hover{border-color:#B9B9B5}.app-button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
    .app-button.primary:hover{background:var(--accent);border-color:var(--accent)}
    .detail-section{border-top:1px solid var(--line);padding:48px 0}
    .detail-section h2{margin:0 0 15px;font-size:21px;font-weight:800;letter-spacing:-.01em}
    .detail-content{max-width:720px;color:var(--muted);font-size:14.5px}.detail-content p{margin:0 0 12px}.detail-content p:last-child{margin-bottom:0}
    .feature-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:20px}
    .feature-card{padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
    .feature-card h3{margin:0 0 7px;font-size:15px;font-weight:800}.feature-card p{margin:0;color:var(--muted);font-size:13.5px}
    .steps{max-width:720px;margin:20px 0 0;padding:0;list-style:none;counter-reset:step}.steps li{position:relative;min-height:26px;padding:1px 0 16px 40px;color:var(--muted);font-size:14px}.steps li::before{content:counter(step);counter-increment:step;position:absolute;left:0;top:0;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--ink);color:var(--paper);font-size:12px;font-weight:800}
    .environment{max-width:720px;margin-top:18px;border-top:1px solid var(--line)}.environment-item{display:flex;justify-content:space-between;gap:20px;padding:13px 4px;border-bottom:1px solid var(--line);font-size:14px}.environment-label{color:var(--muted)}.environment-value{text-align:right;font-weight:700}
    .notice-list{max-width:820px;margin-top:18px;border-top:1px solid var(--line)}.notice-item{display:grid;grid-template-columns:92px minmax(0,1fr) 18px;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line);font-size:14px}.notice-date{color:var(--muted);font-size:12.5px}.notice-title{min-width:0;font-weight:700}.notice-arrow{color:var(--muted);text-align:right}.notice-item:hover .notice-title{color:var(--accent)}.notice-empty{padding:24px 4px;color:var(--muted);font-size:14px}
    .related-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:20px}.related-card{display:block;padding:17px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}.related-card:hover{border-color:#B9B9B5}.related-card h3{margin:0 0 6px;font-size:14.5px}.related-card p{margin:0;color:var(--muted);font-size:12.5px}
    .bottom-cta{border-top:1px solid var(--line);padding:48px 0 56px;text-align:center}.bottom-cta h2{margin:0 0 17px;font-size:21px;font-weight:800}.bottom-cta .app-actions{justify-content:center;padding-bottom:0}
    .back-link{display:inline-flex;align-items:center;gap:5px;margin:0 0 54px;color:var(--muted);font-size:13.5px;font-weight:700}.back-link:hover{color:var(--ink)}
    .loading,.error-message{padding:80px 0;text-align:center;color:var(--muted);font-size:14px}.error-message small{display:block;margin-top:8px;color:var(--muted)}
    @media(max-width:700px){.app-hero{align-items:flex-start;gap:17px}.app-icon{width:70px;height:70px;flex-basis:70px;border-radius:16px}.feature-grid,.related-grid{grid-template-columns:1fr}.environment{max-width:none}}
    @media(max-width:500px){.breadcrumb{padding-top:20px;font-size:12px}.app-hero{display:block;padding-top:22px}.app-icon{margin-bottom:15px}.app-description{font-size:14.5px}.app-actions .app-button{flex:1}.notice-item{grid-template-columns:72px minmax(0,1fr) 14px;gap:9px}.notice-title{font-size:13.5px}.environment-item{font-size:13.5px}}
  </style>
</head>
<body>
<!--#include header-->
<main id="app-detail">
  <div class="wrap">
    <div class="loading">앱 정보를 불러오는 중입니다.</div>
  </div>
</main>
<!--#include footer-->
<script>
  const APP_ID = "an";

  const APP_CONTENT = {
    intro: `
      <p>알파카 메모장은 Windows 환경에서 간단한 텍스트 메모를 빠르게 작성하고 관리할 수 있도록 만든 메모장 프로그램입니다.</p>
      <p>복잡한 문서 편집 기능보다는 업무 중 떠오른 아이디어, 전화 메모, 할 일, 임시 문구처럼 빠르게 기록하고 다시 확인해야 하는 내용을 편리하게 작성하는 데 초점을 맞추었습니다.</p>
      <p>2026년 8월 업데이트에서는 날짜 및 시간 입력과 빠른 입력 기능이 추가되어 반복적으로 입력하는 문구나 현재 시각을 메모에 넣을 때의 편의성을 높였습니다.</p>
    `,
    features: [
      {title:"간편한 메모 작성",description:"불필요한 기능을 최소화한 구성으로 필요한 내용을 빠르게 입력하고 수정할 수 있습니다."},
      {title:"날짜 및 시간 입력",description:"현재 날짜와 시간을 메모에 간편하게 입력할 수 있어 업무 기록이나 작업 시간 정리에 활용할 수 있습니다."},
      {title:"빠른 입력 기능",description:"자주 사용하는 내용을 빠르게 입력할 수 있어 반복적인 문구를 작성하는 업무에 활용할 수 있습니다."},
      {title:"클립보드 활용",description:"메모 내용을 복사하여 다른 프로그램으로 옮기거나 다른 곳의 텍스트를 가져와 편집하는 작업에 활용할 수 있습니다."},
      {title:"Windows 데스크톱 프로그램",description:"웹 브라우저가 아닌 Windows에서 실행되는 프로그램으로 별도의 브라우저 탭 없이 사용할 수 있습니다."},
      {title:"가벼운 업무용 메모",description:"문서 작성 프로그램을 열기에는 부담스럽지만 내용을 임시로 기록해야 하는 상황에서 빠르게 사용할 수 있습니다."}
    ],
    usage: [
      "GitHub Releases에서 알파카 메모장의 최신 버전을 다운로드합니다.",
      "Windows에서 프로그램을 실행한 후 메모 입력 영역에 필요한 내용을 작성합니다.",
      "필요한 경우 날짜와 시간 입력 또는 빠른 입력 기능을 이용하여 반복적으로 사용하는 내용을 빠르게 입력합니다.",
      "작성한 메모를 수정하거나 클립보드를 이용해 다른 프로그램으로 내용을 복사하여 활용합니다.",
      "프로그램의 최신 버전이나 변경 사항은 GitHub 저장소 및 관련 공지사항에서 확인할 수 있습니다."
    ],
    additional: `
      <p>알파카 메모장은 현재 <strong>v1.0</strong>으로 제공됩니다.</p>
      <p>최신 실행 파일은 GitHub Releases에서 확인할 수 있으며, 프로그램의 소스코드와 개발 관련 정보도 GitHub 저장소에서 확인할 수 있습니다.</p>
    `
  };

  const $ = selector => document.querySelector(selector);

  function escapeHtml(value){
    return String(value ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;");
  }

  function formatDate(value){return value ? String(value).replace(/-/g,".") : "-";}

  function categoryName(category){
    const names={work:"업무",life:"생활",dev:"개발자"};
    return names[category] || category || "-";
  }

  function platformName(platform){
    const names={web:"Web",windows:"Windows"};
    return names[platform] || platform || "-";
  }

  function primaryAction(app){
    if(app.platform === "web" && app.url) return {text:"바로 열기 ↗",url:app.url};
    if(app.platform === "windows" && app.downloadUrl) return {text:"다운로드 ↗",url:app.downloadUrl};
    return null;
  }

  function getRelatedApps(app,allApps){
    return allApps.filter(item=>item.id!==app.id && item.category===app.category).slice(0,3);
  }

  function getRelatedUrl(app){
    return `./${app.id}.html`;
  }

  function renderFeatures(features){
    return features.map(feature=>`
      <article class="feature-card">
        <h3>${escapeHtml(feature.title)}</h3>
        <p>${escapeHtml(feature.description)}</p>
      </article>
    `).join("");
  }

  function renderUsage(usage){
    return usage.map(step=>`<li>${escapeHtml(step)}</li>`).join("");
  }

  function renderNotices(notices){
    const related=notices.filter(item=>item.appId===APP_ID).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
    if(!related.length) return `<div class="notice-empty">등록된 관련 공지사항이 없습니다.</div>`;
    return related.map(item=>`
      <a class="notice-item" href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">
        <span class="notice-date">${formatDate(item.date)}</span>
        <span class="notice-title">${escapeHtml(item.title)}</span>
        <span class="notice-arrow">↗</span>
      </a>
    `).join("");
  }

  function renderRelated(app,allApps){
    const related=getRelatedApps(app,allApps);
    if(!related.length) return `<div class="notice-empty">관련 도구가 없습니다.</div>`;
    return related.map(item=>`
      <a class="related-card" href="${getRelatedUrl(item)}">
        <h3>${escapeHtml(item.name)}</h3>
        <p>${escapeHtml(item.description || "")}</p>
      </a>
    `).join("");
  }

  function render(app,allApps,notices){
    const action=primaryAction(app);
    document.title=`${app.name} | ALPACA TOOLS`;
    const root=$("#app-detail");
    root.innerHTML=`
      <div class="wrap">
        <div class="breadcrumb">
          <a href="../tools.html">도구</a><span class="breadcrumb-separator">/</span><span>${escapeHtml(app.name)}</span>
        </div>

        <section class="app-hero">
          <img class="app-icon" src="../${escapeHtml(app.icon)}" alt="${escapeHtml(app.name)} 아이콘">
          <div class="app-hero-content">
            <h1>${escapeHtml(app.name)}</h1>
            <p class="app-description">${escapeHtml(app.description)}</p>
            <div class="app-meta">
              <span class="app-meta-item">${escapeHtml(categoryName(app.category))}</span>
              <span class="app-meta-item">${escapeHtml(platformName(app.platform))}</span>
              <span class="app-meta-item">v${escapeHtml(app.version)}</span>
              <span class="app-meta-item">${formatDate(app.updatedAt)} 업데이트</span>
            </div>
          </div>
        </section>

        <div class="app-actions">
          ${action ? `<a class="app-button primary" href="${escapeHtml(action.url)}" target="_blank" rel="noopener noreferrer">${action.text}</a>` : ""}
          ${app.github ? `<a class="app-button" href="${escapeHtml(app.github)}" target="_blank" rel="noopener noreferrer">GitHub ↗</a>` : ""}
          <a class="app-button" href="../tools.html">도구 목록</a>
        </div>

        <section class="detail-section">
          <h2>앱 소개</h2>
          <div class="detail-content">${APP_CONTENT.intro}</div>
        </section>

        <section class="detail-section">
          <h2>주요 기능</h2>
          <div class="feature-grid">${renderFeatures(APP_CONTENT.features)}</div>
        </section>

        <section class="detail-section">
          <h2>사용 방법</h2>
          <ol class="steps">${renderUsage(APP_CONTENT.usage)}</ol>
        </section>

        <section class="detail-section">
          <h2>실행 환경</h2>
          <div class="environment">
            <div class="environment-item"><span class="environment-label">플랫폼</span><span class="environment-value">${escapeHtml(platformName(app.platform))}</span></div>
            <div class="environment-item"><span class="environment-label">버전</span><span class="environment-value">v${escapeHtml(app.version)}</span></div>
            <div class="environment-item"><span class="environment-label">최종 업데이트</span><span class="environment-value">${formatDate(app.updatedAt)}</span></div>
            <div class="environment-item"><span class="environment-label">다운로드</span><span class="environment-value">${app.downloadUrl ? "GitHub Releases" : "-"}</span></div>
          </div>
        </section>

        ${APP_CONTENT.additional ? `<section class="detail-section"><h2>추가 안내</h2><div class="detail-content">${APP_CONTENT.additional}</div></section>` : ""}

        <section class="detail-section">
          <h2>관련 공지사항</h2>
          <div class="notice-list">${renderNotices(notices)}</div>
        </section>

        <section class="detail-section">
          <h2>관련 도구</h2>
          <div class="related-grid">${renderRelated(app,allApps)}</div>
        </section>

        <div class="bottom-cta">
          <h2>${escapeHtml(app.name)}를 사용해 보세요</h2>
          <div class="app-actions">
            ${action ? `<a class="app-button primary" href="${escapeHtml(action.url)}" target="_blank" rel="noopener noreferrer">${action.text}</a>` : ""}
            <a class="app-button" href="../tools.html">도구 목록으로 돌아가기</a>
          </div>
        </div>
        <a class="back-link" href="../tools.html">← 도구 목록으로 돌아가기</a>
      </div>
    `;
  }

  async function loadJson(path){
    const response=await fetch(path);
    if(!response.ok) throw new Error(`${path} (${response.status})`);
    return response.json();
  }

  async function init(){
    try{
      const [appData,noticeData]=await Promise.all([loadJson("../apps.json"),loadJson("../notice.json")]);
      const allApps=Array.isArray(appData.apps) ? appData.apps : [];
      const app=allApps.find(item=>item.id===APP_ID);
      if(!app) throw new Error(`앱 ID를 찾을 수 없습니다: ${APP_ID}`);
      render(app,allApps,Array.isArray(noticeData.notices) ? noticeData.notices : []);
    }catch(error){
      console.error(error);
      $("#app-detail").innerHTML=`<div class="wrap"><div class="error-message">앱 정보를 불러오지 못했습니다.<small>${escapeHtml(error.message)}</small></div></div>`;
    }
  }

  init();
</script>
</body>
</html>
