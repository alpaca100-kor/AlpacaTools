<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Markdown Viewer & Editor 앱 상세 페이지">
  <title>Markdown Viewer & Editor | ALPACA TOOLS</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .breadcrumb{padding-top:28px;font-size:13px;color:var(--muted)}.breadcrumb a:hover{color:var(--ink)}.breadcrumb-separator{margin:0 7px;color:#B7B8B5}
    .app-hero{display:flex;align-items:center;gap:24px;padding:30px 0 28px}.app-icon{width:88px;height:88px;flex:0 0 88px;object-fit:contain;border:1px solid var(--line);border-radius:20px;background:var(--surface)}.app-icon-emoji{display:flex;align-items:center;justify-content:center;font-size:48px;line-height:1}.app-hero-content{min-width:0}.app-hero h1{margin:0 0 8px;font-size:clamp(30px,4.2vw,44px);font-weight:800;letter-spacing:-.025em;line-height:1.2}.app-description{margin:0 0 13px;max-width:700px;color:var(--muted);font-size:16px}.app-meta{display:flex;flex-wrap:wrap;gap:5px 12px;color:var(--muted);font-size:13px}.app-meta-item+.app-meta-item::before{content:"·";margin-right:12px;color:#B7B8B5}
    .app-actions{display:flex;flex-wrap:wrap;gap:9px;padding:0 0 46px}.app-button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:13.5px;font-weight:700}.app-button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}.app-button.primary:hover{background:var(--accent);border-color:var(--accent)}
    .detail-section{border-top:1px solid var(--line);padding:48px 0}.detail-section h2{margin:0 0 15px;font-size:21px;font-weight:800}.detail-content{max-width:720px;color:var(--muted);font-size:14.5px}.detail-content p{margin:0 0 12px}.feature-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:20px}.feature-card{padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}.feature-card h3{margin:0 0 7px;font-size:15px}.feature-card p{margin:0;color:var(--muted);font-size:13.5px}.steps{max-width:720px;margin:20px 0 0;padding:0;list-style:none;counter-reset:step}.steps li{position:relative;padding:1px 0 16px 40px;color:var(--muted);font-size:14px}.steps li::before{content:counter(step);counter-increment:step;position:absolute;left:0;top:0;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--ink);color:var(--paper);font-size:12px;font-weight:800}.environment{max-width:720px;margin-top:18px;border-top:1px solid var(--line)}.environment-item{display:flex;justify-content:space-between;gap:20px;padding:13px 4px;border-bottom:1px solid var(--line);font-size:14px}.environment-label{color:var(--muted)}.environment-value{text-align:right;font-weight:700}.related-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:20px}.related-card{display:block;padding:17px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}.related-card h3{margin:0 0 6px;font-size:14.5px}.related-card p{margin:0;color:var(--muted);font-size:12.5px}.back-link{display:inline-flex;margin:0 0 54px;color:var(--muted);font-size:13.5px;font-weight:700}.loading{padding:80px 0;text-align:center;color:var(--muted)}@media(max-width:700px){.app-hero{align-items:flex-start;gap:17px}.app-icon{width:70px;height:70px;flex-basis:70px}.app-icon-emoji{font-size:38px}.feature-grid,.related-grid{grid-template-columns:1fr}}@media(max-width:500px){.app-hero{display:block;padding-top:22px}.app-icon{margin-bottom:15px}.app-actions .app-button{flex:1}}
  </style>
</head>
<body>
<!--#include header-->
<main id="app-detail"><div class="wrap"><div class="loading">앱 정보를 불러오는 중입니다.</div></div></main>
<!--#include footer-->
<script>
const APP_ID="md-ve";
const APP_CONTENT={
 intro:`<p>Markdown Viewer & Editor는 마크다운 파일을 브라우저에서 바로 열어보고 수정할 수 있는 웹 기반 뷰어 겸 편집기입니다.</p><p>별도의 설치 과정 없이 브라우저에서 실행할 수 있으며, 마크다운 문서를 작성하면서 결과를 실시간으로 확인할 수 있도록 구성되어 있습니다.</p>`,
 features:[
  {title:"Markdown 미리보기",description:"마크다운 문법을 읽기 쉬운 문서 형태로 렌더링하여 결과를 바로 확인할 수 있습니다."},
  {title:"문서 편집",description:"브라우저의 편집 영역에서 Markdown 내용을 직접 작성하고 수정할 수 있습니다."},
  {title:"분할 화면",description:"편집 영역과 Viewer 영역을 나누어 작성 내용과 렌더링 결과를 동시에 확인할 수 있습니다."},
  {title:"로컬 환경 중심",description:"별도의 프로그램 설치 없이 브라우저에서 실행할 수 있어 간단한 Markdown 작업에 활용할 수 있습니다."}
 ],
 usage:["상단의 바로 열기 버튼을 눌러 Markdown Viewer & Editor를 실행합니다.","Markdown 내용을 편집 영역에 입력하거나 기존 Markdown 파일을 불러옵니다.","Viewer 영역에서 렌더링된 문서 결과를 확인하면서 내용을 수정합니다."],
 additional:`<p>이 도구는 Markdown 문서를 빠르게 확인하거나 간단하게 수정할 때 활용할 수 있습니다. 실제 지원 문법과 저장 방식은 실행 페이지에서 확인할 수 있습니다.</p>`
};
const $=s=>document.querySelector(s);function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;")};function date(v){return v?String(v).replace(/-/g,"."):"-"};function cat(v){return({work:"업무",life:"생활",dev:"개발자"})[v]||v||"-"};function plat(v){return({web:"Web",windows:"Windows"})[v]||v||"-"};
function related(app,apps){return apps.filter(x=>x.id!==app.id&&x.category===app.category).slice(0,3)}function href(x){const pages=new Set(["ac","ae","aie-exe","aie-web","an","EdgeCM","md-ve","pdf2jpg","png-be","retirement-age-calc"]);return pages.has(x.id)?`./${encodeURIComponent(x.id)}.html`:(x.repoUrl||x.url||x.downloadUrl||x.github||"../tools.html")};
function icon(app){const i=String(app.icon||"").trim();if(!i)return `<div class="app-icon app-icon-emoji">🛠️</div>`;if(/^(https?:\/\/|data:image\/)|\.(png|jpe?g|gif|webp|svg|ico)(\?.*)?$/i.test(i)){const s=/^(https?:\/\/|data:image\/)/i.test(i)?i:`../${i.replace(/^\.\//,"")}`;return `<img class="app-icon" src="${esc(s)}" alt="${esc(app.name)} 아이콘">`}return `<div class="app-icon app-icon-emoji" role="img" aria-label="${esc(app.name)} 아이콘">${esc(i)}</div>`}
async function load(){try{const [a,n]=await Promise.all([fetch("../apps.json").then(r=>r.json()),fetch("../notice.json").then(r=>r.json())]);const apps=a.apps||a;const notices=n.notices||n;const app=apps.find(x=>x.id===APP_ID);if(!app)throw Error("앱 정보를 찾을 수 없습니다.");const rel=related(app,apps);$("#app-detail").innerHTML=`<div class="wrap"><div class="breadcrumb"><a href="../index.html">ALPACA TOOLS</a><span class="breadcrumb-separator">›</span><a href="../tools.html">모든 도구</a><span class="breadcrumb-separator">›</span><span>${esc(app.name)}</span></div><section class="app-hero">${icon(app)}<div class="app-hero-content"><h1>${esc(app.name)}</h1><p class="app-description">${esc(app.description)}</p><div class="app-meta"><span class="app-meta-item">${esc(cat(app.category))}</span><span class="app-meta-item">${esc(plat(app.platform))}</span><span class="app-meta-item">v${esc(app.version)}</span><span class="app-meta-item">${esc(date(app.updatedAt))} 업데이트</span></div></div></section><div class="app-actions"><a class="app-button primary" href="${esc(app.url)}" target="_blank" rel="noopener">바로 열기 ↗</a><a class="app-button" href="${esc(app.github)}" target="_blank" rel="noopener">GitHub ↗</a></div><section class="detail-section"><h2>앱 소개</h2><div class="detail-content">${APP_CONTENT.intro}</div></section><section class="detail-section"><h2>주요 기능</h2><div class="feature-grid">${APP_CONTENT.features.map(f=>`<article class="feature-card"><h3>${esc(f.title)}</h3><p>${esc(f.description)}</p></article>`).join("")}</div></section><section class="detail-section"><h2>사용 방법</h2><ol class="steps">${APP_CONTENT.usage.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></section><section class="detail-section"><h2>실행 환경</h2><div class="environment"><div class="environment-item"><span class="environment-label">플랫폼</span><span class="environment-value">${esc(plat(app.platform))}</span></div><div class="environment-item"><span class="environment-label">버전</span><span class="environment-value">v${esc(app.version)}</span></div><div class="environment-item"><span class="environment-label">최근 업데이트</span><span class="environment-value">${esc(date(app.updatedAt))}</span></div></div></section><section class="detail-section"><h2>추가 안내</h2><div class="detail-content">${APP_CONTENT.additional}</div></section><section class="detail-section"><h2>관련 공지사항</h2><div class="detail-content">${notices.filter(x=>x.appId===APP_ID).length?notices.filter(x=>x.appId===APP_ID).map(x=>`<p><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(date(x.date))} · ${esc(x.title)} ↗</a></p>`).join(""):"<p>아직 등록된 관련 공지사항이 없습니다.</p>"}</div></section><section class="detail-section"><h2>관련 도구</h2><div class="related-grid">${rel.map(x=>`<a class="related-card" href="${esc(href(x))}" ${href(x).startsWith("./")?'target="_self"':'target="_blank" rel="noopener"'}><h3>${esc(x.name)}</h3><p>${esc(x.description||"")}</p></a>`).join("")}</div></section><a class="back-link" href="../tools.html">← 도구 목록으로 돌아가기</a></div>`}catch(e){$("#app-detail").innerHTML=`<div class="wrap"><div class="loading">앱 정보를 불러오지 못했습니다.<br>${esc(e.message)}</div></div>`}}load();
</script>
</body>
</html>
