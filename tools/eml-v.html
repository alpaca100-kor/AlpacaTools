<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EML Viewer - 브라우저에서 EML(전자메일) 파일을 열람하는 웹앱">
  <title>EML Viewer | ALPACA TOOLS</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .breadcrumb{padding-top:28px;font-size:13px;color:var(--muted)}
    .breadcrumb a:hover{color:var(--ink)}.breadcrumb-separator{margin:0 7px;color:#B7B8B5}
    .app-hero{display:flex;align-items:center;gap:24px;padding:30px 0 28px}
    .app-icon{width:88px;height:88px;flex:0 0 88px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:20px;background:var(--surface);font-size:48px;line-height:1}
    .app-hero-content{min-width:0}.app-hero h1{margin:0 0 8px;font-size:clamp(30px,4.2vw,44px);font-weight:800;letter-spacing:-.025em;line-height:1.2}
    .app-description{margin:0 0 13px;max-width:700px;color:var(--muted);font-size:16px}
    .app-meta{display:flex;flex-wrap:wrap;gap:5px 12px;color:var(--muted);font-size:13px}
    .app-meta-item+.app-meta-item::before{content:"·";margin-right:12px;color:#B7B8B5}
    .app-actions{display:flex;flex-wrap:wrap;gap:9px;padding:0 0 46px}
    .app-button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:13.5px;font-weight:700;transition:background .15s,border-color .15s,color .15s}
    .app-button:hover{border-color:#B9B9B5}.app-button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}.app-button.primary:hover{background:var(--accent);border-color:var(--accent)}
    .detail-section{border-top:1px solid var(--line);padding:48px 0}.detail-section h2{margin:0 0 15px;font-size:21px;font-weight:800;letter-spacing:-.01em}
    .detail-content{max-width:720px;color:var(--muted);font-size:14.5px}.detail-content p{margin:0 0 12px}.detail-content p:last-child{margin-bottom:0}
    .feature-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:20px}
    .feature-card{padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
    .feature-card h3{margin:0 0 7px;font-size:15px;font-weight:800}.feature-card p{margin:0;color:var(--muted);font-size:13.5px}
    .steps{max-width:720px;margin:20px 0 0;padding:0;list-style:none;counter-reset:step}
    .steps li{position:relative;min-height:26px;padding:1px 0 16px 40px;color:var(--muted);font-size:14px}
    .steps li::before{content:counter(step);counter-increment:step;position:absolute;left:0;top:0;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--ink);color:var(--paper);font-size:12px;font-weight:800}
    .environment{max-width:720px;margin-top:18px;border-top:1px solid var(--line)}.environment-item{display:flex;justify-content:space-between;gap:20px;padding:13px 4px;border-bottom:1px solid var(--line);font-size:14px}
    .environment-label{color:var(--muted)}.environment-value{text-align:right;font-weight:700}
    .notice-list{max-width:820px;margin-top:18px;border-top:1px solid var(--line)}.notice-item{display:grid;grid-template-columns:92px minmax(0,1fr) 18px;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line);font-size:14px}
    .notice-date{color:var(--muted);font-size:12.5px}.notice-title{min-width:0;font-weight:700}.notice-arrow{color:var(--muted);text-align:right}
    .related-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:20px}.related-card{display:block;padding:17px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
    .related-card:hover{border-color:#B9B9B5}.related-card h3{margin:0 0 6px;font-size:14.5px}.related-card p{margin:0;color:var(--muted);font-size:12.5px}
    .bottom-cta{border-top:1px solid var(--line);padding:48px 0 56px;text-align:center}.bottom-cta h2{margin:0 0 17px;font-size:21px;font-weight:800}.bottom-cta .app-actions{justify-content:center;padding-bottom:0}
    .back-link{display:inline-flex;align-items:center;gap:5px;margin:0 0 54px;color:var(--muted);font-size:13.5px;font-weight:700}.back-link:hover{color:var(--ink)}
    .loading,.error-message{padding:80px 0;text-align:center;color:var(--muted);font-size:14px}.error-message small{display:block;margin-top:8px;color:var(--muted)}
    @media(max-width:700px){.app-hero{align-items:flex-start;gap:17px}.app-icon{width:70px;height:70px;flex-basis:70px;border-radius:16px;font-size:38px}.feature-grid,.related-grid{grid-template-columns:1fr}.environment{max-width:none}}
    @media(max-width:500px){.breadcrumb{padding-top:20px;font-size:12px}.app-hero{display:block;padding-top:22px}.app-icon{margin-bottom:15px}.app-description{font-size:14.5px}.app-actions .app-button{flex:1}.notice-item{grid-template-columns:72px minmax(0,1fr) 14px;gap:9px}.notice-title{font-size:13.5px}.environment-item{font-size:13.5px}}
  </style>
</head>
<body>
<!--#include header-->
<main id="app-detail"><div class="wrap"><div class="loading">앱 정보를 불러오는 중입니다.</div></div></main>
<!--#include footer-->
<script>
const APP_ID = "eml-v";
const APP_CONTENT = {
  intro: `
    <p>EML Viewer는 이메일 프로그램에서 저장한 EML(.eml) 파일을 별도의 데스크톱 프로그램 없이 웹 브라우저에서 열람할 수 있도록 만든 웹앱입니다.</p>
    <p>EML 파일을 브라우저에서 직접 선택하거나 끌어다 놓으면 메일 제목, 발신자, 수신자, 참조, 날짜 등의 헤더 정보와 이메일 본문을 확인할 수 있습니다.</p>
    <p>파일 분석은 브라우저 안에서 이루어지며, 서버로 EML 파일을 업로드하지 않는 방식으로 동작합니다. 이메일 본문은 HTML 정제 과정을 거쳐 안전하게 표시하고 외부 이미지는 기본적으로 차단합니다.</p>
  `,
  additional: `
    <p>EML Viewer는 웹 브라우저에서 실행되는 단일 페이지 웹앱입니다. EML/MIME 파싱에는 PostalMime, HTML 정제에는 DOMPurify를 사용합니다.</p>
    <p>현재 최대 50MB의 EML 파일을 지원하며, 인터넷 연결이 필요한 외부 라이브러리를 불러오지 못하면 파일을 분석할 수 없습니다.</p>
  `
};

const $ = selector => document.querySelector(selector);
function escapeHtml(value){return String(value??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\\\"/g,"&quot;").replace(/'/g,"&#039;");}
function formatDate(value){return value?String(value).replace(/-/g,"."): "-";}
function categoryName(value){return ({work:"업무",life:"생활",dev:"개발자"})[value]||value||"-";}
function platformName(value){return ({web:"Web",windows:"Windows"})[value]||value||"-";}
function getPrimaryAction(app){return app.platform==="web"&&app.url?{text:"바로 열기 ↗",url:app.url}:null;}
function getRelatedApps(app,apps){return apps.filter(item=>item.id!==app.id&&item.category===app.category).slice(0,3);}
function getRelatedLink(item){
  const internalIds=new Set(["ac","ad","ae","aie-exe","aie-web","an","EdgeCM","eml-v","md-ve","pdf2jpg","png-be","retirement-age-calc"]);
  return internalIds.has(item.id)?{href:`./${encodeURIComponent(item.id)}.html`,internal:true}:{href:item.repoUrl||item.url||item.downloadUrl||item.github||"../tools.html",internal:false};
}
function renderPage(app,apps,notices){
  const primary=getPrimaryAction(app);
  const primaryButton=primary?`<a class="app-button primary" href="${escapeHtml(primary.url)}" target="_blank" rel="noopener">${escapeHtml(primary.text)}</a>`:"";
  const githubButton=app.github?`<a class="app-button" href="${escapeHtml(app.github)}" target="_blank" rel="noopener">GitHub ↗</a>`:"";
  const relatedNotices=notices.filter(n=>n.appId===APP_ID).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const noticesHtml=relatedNotices.length?relatedNotices.map(n=>`<a class="notice-item" href="${escapeHtml(n.url)}" target="_blank" rel="noopener"><span class="notice-date">${escapeHtml(formatDate(n.date))}</span><span class="notice-title">${escapeHtml(n.title)}</span><span class="notice-arrow">↗</span></a>`).join(""):`<div class="notice-empty">아직 등록된 관련 공지사항이 없습니다.</div>`;
  const relatedHtml=getRelatedApps(app,apps).map(item=>{const link=getRelatedLink(item);return `<a class="related-card" href="${escapeHtml(link.href)}" ${link.internal?'target="_self"':'target="_blank" rel="noopener"'}><h3>${escapeHtml(item.name)}</h3><p>${escapeHtml(item.description||"")}</p></a>`;}).join("");
  $("#app-detail").innerHTML=`
    <div class="wrap">
      <div class="breadcrumb" aria-label="현재 위치"><a href="../index.html">ALPACA TOOLS</a><span class="breadcrumb-separator">›</span><a href="../tools.html">모든 도구</a><span class="breadcrumb-separator">›</span><span>${escapeHtml(app.name)}</span></div>
      <section class="app-hero">
        <div class="app-icon" role="img" aria-label="EML Viewer 아이콘">📧</div>
        <div class="app-hero-content">
          <h1>${escapeHtml(app.name)}</h1>
          <p class="app-description">${escapeHtml(app.description||"")}</p>
          <div class="app-meta"><span class="app-meta-item">${escapeHtml(categoryName(app.category))}</span><span class="app-meta-item">${escapeHtml(platformName(app.platform))}</span><span class="app-meta-item">v${escapeHtml(app.version||"-")}</span><span class="app-meta-item">${escapeHtml(formatDate(app.updatedAt))} 업데이트</span></div>
        </div>
      </section>
      <div class="app-actions">${primaryButton}${githubButton}</div>
      <section class="detail-section"><h2>앱 소개</h2><div class="detail-content">${APP_CONTENT.intro}</div></section>
      <section class="detail-section"><h2>주요 기능</h2><div class="feature-grid">
        <article class="feature-card"><h3>브라우저에서 EML 열람</h3><p>EML 파일을 별도 프로그램 없이 최신 웹 브라우저에서 바로 열 수 있습니다.</p></article>
        <article class="feature-card"><h3>간편한 파일 선택</h3><p>파일 선택 버튼뿐 아니라 EML 파일을 화면에 끌어다 놓는 방식도 지원합니다.</p></article>
        <article class="feature-card"><h3>메일 정보 확인</h3><p>제목, 발신자, 수신자, 참조, Reply-To, 날짜 등 주요 메일 헤더를 확인할 수 있습니다.</p></article>
        <article class="feature-card"><h3>HTML·텍스트 본문 표시</h3><p>HTML 이메일과 일반 텍스트 이메일을 모두 확인할 수 있으며 HTML 본문은 정제 후 표시합니다.</p></article>
        <article class="feature-card"><h3>첨부파일 처리</h3><p>첨부파일의 종류와 크기를 확인하고 이미지 미리보기, PDF 열기, 파일 다운로드를 이용할 수 있습니다.</p></article>
        <article class="feature-card"><h3>개인정보 보호 중심 설계</h3><p>EML 파일 자체를 서버로 전송하지 않고 브라우저에서 처리하며 외부 이미지는 기본적으로 차단합니다.</p></article>
      </div></section>
      <section class="detail-section"><h2>사용 방법</h2><ol class="steps">
        <li>EML Viewer에서 <strong>EML 파일 열기</strong>를 클릭하거나 EML 파일을 화면의 영역으로 끌어다 놓습니다.</li>
        <li>브라우저에서 EML 파일을 분석하면 메일 제목과 발신·수신 정보가 표시됩니다.</li>
        <li>이메일 본문을 확인하고 필요한 경우 메일 정보를 복사합니다.</li>
        <li>첨부파일이 있다면 이미지 미리보기 또는 PDF 열기 기능을 사용하거나 파일을 다운로드합니다.</li>
        <li>다른 EML 파일을 확인하려면 상단의 <strong>새 파일 열기</strong>를 선택합니다.</li>
      </ol></section>
      <section class="detail-section"><h2>실행 환경</h2><div class="environment">
        <div class="environment-item"><span class="environment-label">플랫폼</span><span class="environment-value">Web</span></div>
        <div class="environment-item"><span class="environment-label">지원 파일</span><span class="environment-value">EML (.eml)</span></div>
        <div class="environment-item"><span class="environment-label">최대 파일 크기</span><span class="environment-value">50MB</span></div>
        <div class="environment-item"><span class="environment-label">버전</span><span class="environment-value">v${escapeHtml(app.version||"-")}</span></div>
        <div class="environment-item"><span class="environment-label">최근 업데이트</span><span class="environment-value">${escapeHtml(formatDate(app.updatedAt))}</span></div>
      </div></section>
      <section class="detail-section"><h2>추가 안내</h2><div class="detail-content">${APP_CONTENT.additional}</div></section>
      <section class="detail-section"><h2>관련 공지사항</h2><div class="notice-list">${noticesHtml}</div></section>
      <section class="detail-section"><h2>관련 도구</h2><div class="related-grid">${relatedHtml||'<div class="detail-content"><p>같은 카테고리의 관련 도구가 없습니다.</p></div>'}</div></section>
      <div class="bottom-cta"><h2>EML Viewer를 사용해 보세요.</h2><div class="app-actions">${primaryButton}</div></div>
      <a class="back-link" href="../tools.html">← 도구 목록으로 돌아가기</a>
    </div>`;
}
async function loadJson(path){const response=await fetch(path);if(!response.ok)throw new Error(`${path} 불러오기 실패`);return response.json();}
async function loadData(){
  try{
    const [appsData,noticesData]=await Promise.all([loadJson("../apps.json"),loadJson("../notice.json")]);
    const apps=Array.isArray(appsData)?appsData:(appsData.apps||[]);
    const notices=Array.isArray(noticesData)?noticesData:(noticesData.notices||[]);
    const app=apps.find(item=>item.id===APP_ID);
    if(!app)throw new Error(`apps.json에서 "${APP_ID}" 앱을 찾을 수 없습니다.`);
    renderPage(app,apps,notices);
  }catch(error){
    console.error(error);
    $("#app-detail").innerHTML=`<div class="wrap"><div class="error-message">앱 정보를 불러오지 못했습니다.<small>${escapeHtml(error.message)}</small></div></div>`;
  }
}
loadData();
</script>
</body>
</html>
