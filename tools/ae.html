<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="ALPACA TOOLS 앱 상세 페이지">
  <title>앱 이름 | ALPACA TOOLS</title>

  <!-- tools 폴더에서 루트의 공통 스타일을 사용 -->
  <link rel="stylesheet" href="../style.css">

  <style>
    /* =========================================================
       ALPACA TOOLS - App Detail Page
       이 영역은 앱 상세 페이지에서만 사용하는 추가 스타일입니다.
       ========================================================= */

    .breadcrumb{
      padding-top:28px;
      font-size:13px;
      color:var(--muted);
    }

    .breadcrumb a:hover{color:var(--ink);}
    .breadcrumb-separator{margin:0 7px;color:#B7B8B5;}

    .app-hero{
      display:flex;
      align-items:center;
      gap:24px;
      padding:30px 0 28px;
    }

    .app-icon{
      width:88px;
      height:88px;
      flex:0 0 88px;
      object-fit:contain;
      border:1px solid var(--line);
      border-radius:20px;
      background:var(--surface);
    }

    .app-hero-content{min-width:0;}

    .app-hero h1{
      margin:0 0 8px;
      font-size:clamp(30px,4.2vw,44px);
      font-weight:800;
      letter-spacing:-0.025em;
      line-height:1.2;
    }

    .app-description{
      margin:0 0 13px;
      max-width:700px;
      color:var(--muted);
      font-size:16px;
    }

    .app-meta{
      display:flex;
      flex-wrap:wrap;
      gap:5px 12px;
      color:var(--muted);
      font-size:13px;
    }

    .app-meta-item + .app-meta-item::before{
      content:"·";
      margin-right:12px;
      color:#B7B8B5;
    }

    .app-actions{
      display:flex;
      flex-wrap:wrap;
      gap:9px;
      padding:0 0 46px;
    }

    .app-button{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      min-height:40px;
      padding:9px 16px;
      border:1px solid var(--line);
      border-radius:8px;
      background:var(--surface);
      color:var(--ink);
      font-size:13.5px;
      font-weight:700;
      transition:background .15s,border-color .15s,color .15s;
    }

    .app-button:hover{border-color:#B9B9B5;}

    .app-button.primary{
      background:var(--ink);
      color:var(--paper);
      border-color:var(--ink);
    }

    .app-button.primary:hover{
      background:var(--accent);
      border-color:var(--accent);
    }

    .detail-section{
      border-top:1px solid var(--line);
      padding:48px 0;
    }

    .detail-section h2{
      margin:0 0 15px;
      font-size:21px;
      font-weight:800;
      letter-spacing:-0.01em;
    }

    .detail-content{
      max-width:720px;
      color:var(--muted);
      font-size:14.5px;
    }

    .detail-content p{
      margin:0 0 12px;
    }

    .detail-content p:last-child{margin-bottom:0;}

    .feature-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
      margin-top:20px;
    }

    .feature-card{
      padding:18px;
      border:1px solid var(--line);
      border-radius:12px;
      background:var(--surface);
    }

    .feature-card h3{
      margin:0 0 7px;
      font-size:15px;
      font-weight:800;
    }

    .feature-card p{
      margin:0;
      color:var(--muted);
      font-size:13.5px;
    }

    .steps{
      max-width:720px;
      margin:20px 0 0;
      padding:0;
      list-style:none;
      counter-reset:step;
    }

    .steps li{
      position:relative;
      min-height:26px;
      padding:1px 0 16px 40px;
      color:var(--muted);
      font-size:14px;
    }

    .steps li::before{
      content:counter(step);
      counter-increment:step;
      position:absolute;
      left:0;
      top:0;
      width:26px;
      height:26px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:50%;
      background:var(--ink);
      color:var(--paper);
      font-size:12px;
      font-weight:800;
    }

    .environment{
      max-width:720px;
      margin-top:18px;
      border-top:1px solid var(--line);
    }

    .environment-item{
      display:flex;
      justify-content:space-between;
      gap:20px;
      padding:13px 4px;
      border-bottom:1px solid var(--line);
      font-size:14px;
    }

    .environment-label{color:var(--muted);}
    .environment-value{
      text-align:right;
      font-weight:700;
    }

    .notice-list{
      max-width:820px;
      margin-top:18px;
      border-top:1px solid var(--line);
    }

    .notice-item{
      display:grid;
      grid-template-columns:92px minmax(0,1fr) 18px;
      align-items:center;
      gap:14px;
      padding:14px 4px;
      border-bottom:1px solid var(--line);
      font-size:14px;
    }

    .notice-date{
      color:var(--muted);
      font-size:12.5px;
    }

    .notice-title{
      min-width:0;
      font-weight:700;
    }

    .notice-arrow{
      color:var(--muted);
      text-align:right;
    }

    .notice-item:hover .notice-title{color:var(--accent);}

    .notice-empty{
      padding:24px 4px;
      color:var(--muted);
      font-size:14px;
    }

    .related-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:10px;
      margin-top:20px;
    }

    .related-card{
      display:block;
      padding:17px;
      border:1px solid var(--line);
      border-radius:12px;
      background:var(--surface);
    }

    .related-card:hover{border-color:#B9B9B5;}

    .related-card h3{
      margin:0 0 6px;
      font-size:14.5px;
    }

    .related-card p{
      margin:0;
      color:var(--muted);
      font-size:12.5px;
    }

    .bottom-cta{
      border-top:1px solid var(--line);
      padding:48px 0 56px;
      text-align:center;
    }

    .bottom-cta h2{
      margin:0 0 17px;
      font-size:21px;
      font-weight:800;
    }

    .bottom-cta .app-actions{
      justify-content:center;
      padding-bottom:0;
    }

    .back-link{
      display:inline-flex;
      align-items:center;
      gap:5px;
      margin:0 0 54px;
      color:var(--muted);
      font-size:13.5px;
      font-weight:700;
    }

    .back-link:hover{color:var(--ink);}

    .loading,
    .error-message{
      padding:80px 0;
      text-align:center;
      color:var(--muted);
      font-size:14px;
    }

    .error-message small{
      display:block;
      margin-top:8px;
      color:var(--muted);
    }

    @media (max-width:700px){
      .app-hero{
        align-items:flex-start;
        gap:17px;
      }

      .app-icon{
        width:70px;
        height:70px;
        flex-basis:70px;
        border-radius:16px;
      }

      .feature-grid,
      .related-grid{
        grid-template-columns:1fr;
      }

      .environment{
        max-width:none;
      }
    }

    @media (max-width:500px){
      .breadcrumb{
        padding-top:20px;
        font-size:12px;
      }

      .app-hero{
        display:block;
        padding-top:22px;
      }

      .app-icon{
        margin-bottom:15px;
      }

      .app-description{
        font-size:14.5px;
      }

      .app-actions .app-button{
        flex:1;
      }

      .notice-item{
        grid-template-columns:72px minmax(0,1fr) 14px;
        gap:9px;
      }

      .notice-title{
        font-size:13.5px;
      }

      .environment-item{
        font-size:13.5px;
      }
    }
  </style>
</head>

<body>

<!--#include header-->

<main id="app-detail">
  <div class="wrap">
    <div class="loading">앱 정보를 불러오는 중입니다.</div>
  </div>
</main>

<!--#include footer-->

<script>
  /*
   * ==========================================================
   * ALPACA TOOLS 앱 상세페이지 표준 템플릿
   * ==========================================================
   *
   * 사용 방법
   * ----------------------------------------------------------
   * 1. 이 파일을 tools/{id}.html로 복사합니다.
   *
   * 2. 아래 APP_ID를 해당 앱의 apps.json id로 변경합니다.
   *
   *    예)
   *    알파카 달력       → "ac"
   *    알파카 메모장     → "an"
   *    이미지 편집기 WEB → "aie-web"
   *
   * 3. APP_CONTENT의 앱별 콘텐츠를 작성합니다.
   *
   * 앱의 이름, 아이콘, 버전, 플랫폼, GitHub 주소,
   * 실행/다운로드 주소 및 관련 공지사항은 JSON에서 자동으로
   * 가져오기 때문에 상세페이지마다 중복해서 입력하지 않습니다.
   */

  const APP_ID = "ae";

  /*
   * ==========================================================
   * 앱별 상세 콘텐츠
   * ==========================================================
   *
   * 이 부분만 앱마다 수정합니다.
   *
   * intro      : 앱 상세 소개
   * features   : 주요 기능
   * usage      : 사용 방법
   * additional: 추가 안내(선택)
   */

  const APP_CONTENT = {
    intro: `
      <p>알파카 파일 탐색기는 Windows에서 파일과 폴더를 편리하게 탐색하고 관리할 수 있도록 만든 파일 탐색기 프로그램입니다.</p>
      <p>macOS의 Finder에서 영감을 받은 인터페이스를 바탕으로 자주 사용하는 파일과 폴더를 보다 직관적으로 확인하고 관리할 수 있도록 구성하였습니다.</p>
      <p>Windows 기본 파일 탐색기와 함께 사용하면서 보다 깔끔한 화면 구성과 다른 탐색 경험을 원하는 경우 활용할 수 있습니다.</p>
    `,

    features: [
      {
        title: "Finder 스타일 인터페이스",
        description: "macOS Finder에서 영감을 받은 화면 구성을 적용하여 익숙하면서도 깔끔한 파일 탐색 환경을 제공합니다."
      },
      {
        title: "파일·폴더 탐색",
        description: "Windows에 저장된 파일과 폴더를 탐색하고 원하는 위치로 이동하면서 파일 구조를 확인할 수 있습니다."
      },
      {
        title: "간편한 파일 관리",
        description: "파일과 폴더를 한 화면에서 확인하고 관리할 수 있어 일상적인 파일 정리 작업에 활용할 수 있습니다."
      },
      {
        title: "Windows용 데스크톱 앱",
        description: "Windows 환경에서 실행할 수 있는 데스크톱 프로그램으로 별도의 웹 브라우저 없이 사용할 수 있습니다."
      }
    ],

    usage: [
      "알파카 파일 탐색기를 Windows에서 실행합니다.",
      "탐색 화면에서 원하는 드라이브 또는 폴더로 이동하여 파일과 폴더를 확인합니다.",
      "필요한 파일이나 폴더를 선택하여 탐색 및 관리 작업을 진행합니다.",
      "자주 사용하는 파일 관리 작업이 끝나면 프로그램을 종료합니다."
    ],

    /*
     * 추가 안내가 필요하지 않은 경우 빈 문자열로 둡니다.
     * HTML을 직접 작성할 수 있습니다.
     */
    additional: ""
  };


  /* ==========================================================
     공통 함수
     ========================================================== */

  const $ = (selector) => document.querySelector(selector);

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function formatDate(value) {
    if (!value) return "-";
    return String(value).replace(/-/g, ".");
  }

  function categoryName(category) {
    const names = {
      work: "업무",
      life: "생활",
      developer: "개발자"
    };

    return names[category] || category || "-";
  }

  function platformName(platform) {
    const names = {
      web: "Web",
      windows: "Windows"
    };

    return names[platform] || platform || "-";
  }

  /*
   * platform에 따라 Hero의 대표 버튼을 결정합니다.
   * Web      → 바로 열기
   * Windows → 다운로드
   */
  function getPrimaryAction(app) {
    if (app.platform === "web" && app.url) {
      return {
        text: "바로 열기 ↗",
        url: app.url
      };
    }

    if (app.platform === "windows" && app.downloadUrl) {
      return {
        text: "다운로드 ↗",
        url: app.downloadUrl
      };
    }

    return null;
  }

  /*
   * 관련 도구 선정 규칙
   * - 현재 앱을 제외한 같은 category의 앱 최대 3개
   * - 같은 category 앱이 3개 미만이면 현재 앱을 제외한 앞쪽 3개
   */
  function getRelatedApps(app, allApps) {
    const sameCategory = allApps
      .filter(item => item.id !== app.id)
      .filter(item => item.category === app.category);

    if (sameCategory.length >= 3) {
      return sameCategory.slice(0, 3);
    }

    return allApps
      .filter(item => item.id !== app.id)
      .slice(0, 3);
  }

  /*
   * 관련 도구 링크 규칙 (tools.html과 동일)
   * - tools/{id}.html 상세 페이지가 있으면 해당 페이지로 이동
   * - 없으면 repoUrl → url → downloadUrl → GitHub 저장소 순서로 이동
   */
  function getFallbackHref(item) {
    return item.repoUrl
      || item.url
      || item.downloadUrl
      || "https://github.com/alpaca100-kor/AlpacaTools";
  }

  async function resolveRelatedLink(item) {
    const detailPath = `../tools/${encodeURIComponent(item.id)}.html`;

    try {
      const response = await fetch(detailPath, {
        method: "HEAD",
        cache: "no-store"
      });

      if (response.ok) {
        return { href: detailPath, internal: true };
      }
    } catch (error) {
      console.warn("상세 페이지 확인 실패:", item.id, error);
    }

    return { href: getFallbackHref(item), internal: false };
  }

  async function resolveRelatedLinks(relatedApps) {
    const results = await Promise.all(
      relatedApps.map(async item => [item.id, await resolveRelatedLink(item)])
    );

    return new Map(results);
  }


  /* ==========================================================
     페이지 렌더링
     ========================================================== */

  function renderPage(app, notices, allApps, relatedLinks) {
    document.title = `${app.name} | ALPACA TOOLS`;

    const primary = getPrimaryAction(app);

    const primaryButton = primary
      ? `
        <a class="app-button primary"
           href="${escapeHtml(primary.url)}"
           target="_blank"
           rel="noopener">
          ${escapeHtml(primary.text)}
        </a>
      `
      : "";

    const githubButton = app.github
      ? `
        <a class="app-button"
           href="${escapeHtml(app.github)}"
           target="_blank"
           rel="noopener">
          GitHub ↗
        </a>
      `
      : "";

    /*
     * downloadUrl이 있는 경우 별도의 다운로드 버튼을 제공합니다.
     * 대표 버튼이 Windows 다운로드 버튼인 경우 중복하지 않습니다.
     */
    const secondaryDownloadButton =
      app.downloadUrl && app.platform !== "windows"
        ? `
          <a class="app-button"
             href="${escapeHtml(app.downloadUrl)}"
             target="_blank"
             rel="noopener">
            다운로드 ↗
          </a>
        `
        : "";

    const featuresHtml = (APP_CONTENT.features || [])
      .map(feature => `
        <article class="feature-card">
          <h3>${escapeHtml(feature.title)}</h3>
          <p>${escapeHtml(feature.description)}</p>
        </article>
      `)
      .join("");

    const usageHtml = (APP_CONTENT.usage || [])
      .map(step => `<li>${escapeHtml(step)}</li>`)
      .join("");

    /*
     * notice.json에서 appId가 현재 앱 id와 같은 공지만
     * 가져온 뒤 최신 날짜 순으로 표시합니다.
     */
    const noticesHtml = notices.length
      ? notices.map(notice => `
          <a class="notice-item"
             href="${escapeHtml(notice.url)}"
             target="_blank"
             rel="noopener">
            <span class="notice-date">
              ${escapeHtml(formatDate(notice.date))}
            </span>

            <span class="notice-title">
              ${escapeHtml(notice.title)}
            </span>

            <span class="notice-arrow">↗</span>
          </a>
        `).join("")
      : `
        <div class="notice-empty">
          아직 등록된 관련 공지사항이 없습니다.
        </div>
      `;

    const relatedApps = getRelatedApps(app, allApps);

    const relatedHtml = relatedApps
      .map(item => {
        const link = (relatedLinks && relatedLinks.get(item.id))
          || { href: getFallbackHref(item), internal: false };

        const targetAttr = link.internal
          ? 'target="_self"'
          : 'target="_blank" rel="noopener"';

        return `
        <a class="related-card"
           href="${escapeHtml(link.href)}"
           ${targetAttr}>
          <h3>${escapeHtml(item.name)}</h3>
          <p>${escapeHtml(item.description || "")}</p>
        </a>
      `;
      })
      .join("");

    const additionalHtml = APP_CONTENT.additional
      ? `
        <section class="detail-section">
          <h2>추가 안내</h2>
          <div class="detail-content">
            ${APP_CONTENT.additional}
          </div>
        </section>
      `
      : "";

    $("#app-detail").innerHTML = `
      <div class="wrap">

        <div class="breadcrumb" aria-label="현재 위치">
          <a href="../index.html">ALPACA TOOLS</a>
          <span class="breadcrumb-separator">›</span>
          <a href="../tools.html">모든 도구</a>
          <span class="breadcrumb-separator">›</span>
          <span>${escapeHtml(app.name)}</span>
        </div>


        <!-- =================================================
             앱 기본 정보
             ================================================= -->

        <section class="app-hero">

          <img class="app-icon"
               src="${escapeHtml(app.icon || "")}"
               alt="${escapeHtml(app.name)} 아이콘"
               onerror="this.style.display='none';">

          <div class="app-hero-content">

            <h1>${escapeHtml(app.name)}</h1>

            <p class="app-description">
              ${escapeHtml(app.description || "")}
            </p>

            <div class="app-meta">
              <span class="app-meta-item">
                ${escapeHtml(categoryName(app.category))}
              </span>

              <span class="app-meta-item">
                ${escapeHtml(platformName(app.platform))}
              </span>

              <span class="app-meta-item">
                v${escapeHtml(app.version || "-")}
              </span>

              <span class="app-meta-item">
                ${escapeHtml(formatDate(app.updatedAt))} 업데이트
              </span>
            </div>

          </div>
        </section>


        <!-- =================================================
             주요 버튼
             ================================================= -->

        <div class="app-actions">
          ${primaryButton}
          ${secondaryDownloadButton}
          ${githubButton}
        </div>


        <!-- =================================================
             앱 소개
             ================================================= -->

        <section class="detail-section">
          <h2>${escapeHtml(app.name)} 소개</h2>

          <div class="detail-content">
            ${APP_CONTENT.intro}
          </div>
        </section>


        <!-- =================================================
             주요 기능
             ================================================= -->

        <section class="detail-section">
          <h2>주요 기능</h2>

          <div class="feature-grid">
            ${featuresHtml}
          </div>
        </section>


        <!-- =================================================
             사용 방법
             ================================================= -->

        <section class="detail-section">
          <h2>사용 방법</h2>

          <ol class="steps">
            ${usageHtml}
          </ol>
        </section>


        <!-- =================================================
             이용 환경
             ================================================= -->

        <section class="detail-section">
          <h2>이용 환경</h2>

          <div class="environment">

            <div class="environment-item">
              <span class="environment-label">플랫폼</span>
              <span class="environment-value">
                ${escapeHtml(platformName(app.platform))}
              </span>
            </div>

            <div class="environment-item">
              <span class="environment-label">버전</span>

            <div class="environment-item">
              <span class="environment-label">GitHub</span>
              <span class="environment-value">
                ${app.github ? "공개" : "미제공"}

          </div>
        </section>


        ${additionalHtml}


        <!-- =================================================
             관련 공지사항
             ================================================= -->

        <section class="detail-section">
          <h2>관련 공지사항</h2>

          <div class="notice-list">
            ${noticesHtml}

        <!-- =================================================
             관련 도구

        <section class="detail-section">

        <!-- =================================================
             하단 CTA
             ================================================= -->

      </div>
    `;
  }


  /* ==========================================================
     JSON 데이터 로드
     ========================================================== */

  async function loadData() {
    try {
      if (!APP_ID || APP_ID === "YOUR_APP_ID") {
        throw new Error("APP_ID를 설정하지 않았습니다.");
      }

      /*
       * 상세페이지는 tools 폴더 안에 있으므로
       * apps.json과 notice.json은 한 단계 위에 있습니다.
       */
      const [appsResponse, noticesResponse] = await Promise.all([
        fetch("../apps.json"),
        fetch("../notice.json")
      ]);

      if (!appsResponse.ok) {
        throw new Error("apps.json을 불러오지 못했습니다.");
      }

      if (!noticesResponse.ok) {
        throw new Error("notice.json을 불러오지 못했습니다.");
      }

      const appsData = await appsResponse.json();
      const noticesData = await noticesResponse.json();

      /*
       * 현재 JSON이
       *
       * { "apps": [...] }
       * { "notices": [...] }
       *
       * 형태인 경우를 기본으로 사용합니다.
       */
      const apps = Array.isArray(appsData)
        ? appsData
        : (appsData.apps || []);

      const notices = Array.isArray(noticesData)
        ? noticesData
        : (noticesData.notices || []);

      const app = apps.find(item => item.id === APP_ID);

      if (!app) {
        throw new Error(
          `apps.json에서 "${APP_ID}" 앱을 찾을 수 없습니다.`
        );
      }

      /*
       * 현재 앱과 연결된 공지만 선택합니다.
       * appId가 null인 공지는 특정 앱 상세페이지에 표시되지 않습니다.
       */
      const relatedNotices = notices
        .filter(notice => notice.appId === APP_ID)
        .sort((a, b) =>
          String(b.date || "").localeCompare(String(a.date || ""))
        );

      const relatedLinks = await resolveRelatedLinks(
        getRelatedApps(app, apps)
      );

      renderPage(app, relatedNotices, apps, relatedLinks);

    } catch (error) {
      console.error(error);

      $("#app-detail").innerHTML = `
        <div class="wrap">
          <div class="error-message">
            앱 정보를 불러오지 못했습니다.
            <small>${escapeHtml(error.message)}</small>
          </div>
        </div>
      `;
    }
  }


  /*
   * 모바일 햄버거 메뉴 토글은 partials/header.html에 포함된
   * 공통 스크립트(#menu-toggle, #site-nav)가 처리합니다.
   * 여기서 별도로 처리하면 같은 버튼에 클릭 이벤트가 두 번 걸려
   * 토글이 서로 상쇄되므로 중복 구현하지 않습니다.
   */

  loadData();
</script>
