<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="ALPACA TOOLS 앱 상세 페이지">
  <title>앱 이름 | ALPACA TOOLS</title>

  <!-- tools 폴더에서 루트의 공통 스타일을 사용 -->
  <link rel="stylesheet" href="../style.css">

  <style>
    /* =========================================================
       ALPACA TOOLS - App Detail Page
       이 영역은 앱 상세 페이지에서만 사용하는 추가 스타일입니다.
       ========================================================= */

    .breadcrumb{
      padding-top:28px;
      font-size:13px;
      color:var(--muted);
    }

    .breadcrumb a:hover{color:var(--ink);}
    .breadcrumb-separator{margin:0 7px;color:#B7B8B5;}

    .app-hero{
      display:flex;
      align-items:center;
      gap:24px;
      padding:30px 0 28px;
    }

    .app-icon{
      width:88px;
      height:88px;
      flex:0 0 88px;
      object-fit:contain;
      border:1px solid var(--line);
      border-radius:20px;
      background:var(--surface);
    }

    .app-hero-content{min-width:0;}

    .app-hero h1{
      margin:0 0 8px;
      font-size:clamp(30px,4.2vw,44px);
      font-weight:800;
      letter-spacing:-0.025em;
      line-height:1.2;
    }

    .app-description{
      margin:0 0 13px;
      max-width:700px;
      color:var(--muted);
      font-size:16px;
    }

    .app-meta{
      display:flex;
      flex-wrap:wrap;
      gap:5px 12px;
      color:var(--muted);
      font-size:13px;
    }

    .app-meta-item + .app-meta-item::before{
      content:"·";
      margin-right:12px;
      color:#B7B8B5;
    }

    .app-actions{
      display:flex;
      flex-wrap:wrap;
      gap:9px;
      padding:0 0 46px;
    }

    .app-button{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      min-height:40px;
      padding:9px 16px;
      border:1px solid var(--line);
      border-radius:8px;
      background:var(--surface);
      color:var(--ink);
      font-size:13.5px;
      font-weight:700;
      transition:background .15s,border-color .15s,color .15s;
    }

    .app-button:hover{border-color:#B9B9B5;}

    .app-button.primary{
      background:var(--ink);
      color:var(--paper);
      border-color:var(--ink);
    }

    .app-button.primary:hover{
      background:var(--accent);
      border-color:var(--accent);
    }

    .detail-section{
      border-top:1px solid var(--line);
      padding:48px 0;
    }

    .detail-section h2{
      margin:0 0 15px;
      font-size:21px;
      font-weight:800;
      letter-spacing:-0.01em;
    }

    .detail-content{
      max-width:720px;
      color:var(--muted);
      font-size:14.5px;
    }

    .detail-content p{
      margin:0 0 12px;
    }

    .detail-content p:last-child{margin-bottom:0;}

    .feature-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
      margin-top:20px;
    }

    .feature-card{
      padding:18px;
      border:1px solid var(--line);
      border-radius:12px;
      background:var(--surface);
    }

    .feature-card h3{
      margin:0 0 7px;
      font-size:15px;
      font-weight:800;
    }

    .feature-card p{
      margin:0;
      color:var(--muted);
      font-size:13.5px;
    }

    .steps{
      max-width:720px;
      margin:20px 0 0;
      padding:0;
      list-style:none;
      counter-reset:step;
    }

    .steps li{
      position:relative;
      min-height:26px;
      padding:1px 0 16px 40px;
      color:var(--muted);
      font-size:14px;
    }

    .steps li::before{
      content:counter(step);
      counter-increment:step;
      position:absolute;
      left:0;
      top:0;
      width:26px;
      height:26px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:50%;
      background:var(--ink);
      color:var(--paper);
      font-size:12px;
      font-weight:800;
    }

    .environment{
      max-width:720px;
      margin-top:18px;
      border-top:1px solid var(--line);
    }

    .environment-item{
      display:flex;
      justify-content:space-between;
      gap:20px;
      padding:13px 4px;
      border-bottom:1px solid var(--line);
      font-size:14px;
    }

    .environment-label{color:var(--muted);}
    .environment-value{
      text-align:right;
      font-weight:700;
    }

    .notice-list{
      max-width:820px;
      margin-top:18px;
      border-top:1px solid var(--line);
    }

    .notice-item{
      display:grid;
      grid-template-columns:92px minmax(0,1fr) 18px;
      align-items:center;
      gap:14px;
      padding:14px 4px;
      border-bottom:1px solid var(--line);
      font-size:14px;
    }

    .notice-date{
      color:var(--muted);
      font-size:12.5px;
    }

    .notice-title{
      min-width:0;
      font-weight:700;
    }

    .notice-arrow{
      color:var(--muted);
      text-align:right;
    }

    .notice-item:hover .notice-title{color:var(--accent);}

    .notice-empty{
      padding:24px 4px;
      color:var(--muted);
      font-size:14px;
    }

    .related-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:10px;
      margin-top:20px;
    }

    .related-card{
      display:block;
      padding:17px;
      border:1px solid var(--line);
      border-radius:12px;
      background:var(--surface);
    }

    .related-card:hover{border-color:#B9B9B5;}

    .related-card h3{
      margin:0 0 6px;
      font-size:14.5px;
    }

    .related-card p{
      margin:0;
      color:var(--muted);
      font-size:12.5px;
    }

    .bottom-cta{
      border-top:1px solid var(--line);
      padding:48px 0 56px;
      text-align:center;
    }

    .bottom-cta h2{
      margin:0 0 17px;
      font-size:21px;
      font-weight:800;
    }

    .bottom-cta .app-actions{
      justify-content:center;
      padding-bottom:0;
    }

    .back-link{
      display:inline-flex;
      align-items:center;
      gap:5px;
      margin:0 0 54px;
      color:var(--muted);
      font-size:13.5px;
      font-weight:700;
    }

    .back-link:hover{color:var(--ink);}

    .loading,
    .error-message{
      padding:80px 0;
      text-align:center;
      color:var(--muted);
      font-size:14px;
    }

    .error-message small{
      display:block;
      margin-top:8px;
      color:var(--muted);
    }

    @media (max-width:700px){
      .app-hero{
        align-items:flex-start;
        gap:17px;
      }

      .app-icon{
        width:70px;
        height:70px;
        flex-basis:70px;
        border-radius:16px;
      }

      .feature-grid,
      .related-grid{
        grid-template-columns:1fr;
      }

      .environment{
        max-width:none;
      }
    }

    @media (max-width:500px){
      .breadcrumb{
        padding-top:20px;
        font-size:12px;
      }

      .app-hero{
        display:block;
        padding-top:22px;
      }

      .app-icon{
        margin-bottom:15px;
      }

      .app-description{
        font-size:14.5px;
      }

      .app-actions .app-button{
        flex:1;
      }

      .notice-item{
        grid-template-columns:72px minmax(0,1fr) 14px;
        gap:9px;
      }

      .notice-title{
        font-size:13.5px;
      }

      .environment-item{
        font-size:13.5px;
      }
    }
  </style>
</head>

<body>

<!--#include header-->

<main id="app-detail">
  <div class="wrap">
    <div class="loading">앱 정보를 불러오는 중입니다.</div>
  </div>
</main>

<!--#include footer-->

<script>
  /*
   * ==========================================================
   * ALPACA TOOLS 앱 상세페이지 표준 템플릿
   * ==========================================================
   *
   * 사용 방법
   * ----------------------------------------------------------
   * 1. 이 파일을 tools/{id}.html로 복사합니다.
   *
   * 2. 아래 APP_ID를 해당 앱의 apps.json id로 변경합니다.
   *
   *    예)
   *    알파카 달력       → "ac"
   *    알파카 메모장     → "an"
   *    이미지 편집기 WEB → "aie-web"
   *
   * 3. APP_CONTENT의 앱별 콘텐츠를 작성합니다.
   *
   * 앱의 이름, 아이콘, 버전, 플랫폼, GitHub 주소,
   * 실행/다운로드 주소 및 관련 공지사항은 JSON에서 자동으로
   * 가져오기 때문에 상세페이지마다 중복해서 입력하지 않습니다.
   */

  const APP_ID = "YOUR_APP_ID";

  /* ==========================================================
     앱별 상세 콘텐츠
     ========================================================== */

  const APP_CONTENT = {
    intro: `
      <p>이 앱에 대한 상세한 소개를 작성합니다.</p>
      <p>앱의 제작 목적과 어떤 상황에서 활용할 수 있는지 설명합니다.</p>
    `,

    features: [
      {
        title: "주요 기능 1",
        description: "첫 번째 주요 기능에 대한 설명을 작성합니다."
      },
      {
        title: "주요 기능 2",
        description: "두 번째 주요 기능에 대한 설명을 작성합니다."
      },
      {
        title: "주요 기능 3",
        description: "세 번째 주요 기능에 대한 설명을 작성합니다."
      }
    ],

    usage: [
      "첫 번째 사용 방법을 작성합니다.",
      "두 번째 사용 방법을 작성합니다.",
      "세 번째 사용 방법을 작성합니다."
    ],

    additional: ""
  };

  const $ = (selector) => document.querySelector(selector);

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function formatDate(value) {
    if (!value) return "-";
    return String(value).replace(/-/g, ".");
  }

  function categoryName(category) {
    const names = { work:"업무", life:"생활", dev:"개발자" };
    return names[category] || category || "-";
  }

  function platformName(platform) {
    const names = { web:"Web", windows:"Windows" };
    return names[platform] || platform || "-";
  }

  function getPrimaryAction(app) {
    if (app.platform === "web" && app.url) {
      return { text:"바로 열기 ↗", url:app.url };
    }
    if (app.platform === "windows" && app.downloadUrl) {
      return { text:"다운로드 ↗", url:app.downloadUrl };
    }
    return null;
  }

  function getRelatedApps(app, allApps) {
    return allApps
      .filter(item => item.id !== app.id)
      .filter(item => item.category === app.category)
      .slice(0, 3);
  }

  /*
   * 관련 도구 링크 규칙
   * - tools/{id}.html 상세 페이지가 있으면 해당 페이지로 이동
   * - 없으면 repoUrl → url → downloadUrl → github 순서로 이동
   */
  function getFallbackHref(item) {
    if (item.repoUrl) return item.repoUrl;
    if (item.url) return item.url;
    if (item.downloadUrl) return item.downloadUrl;
    if (item.github) return item.github;
    return "../tools.html";
  }

  function getToolPageIds() {
    return new Set([
      "ac",
      "ae",
      "aie-exe",
      "aie-web",
      "an",
      "EdgeCM"
    ]);
  }

  function getRelatedLink(item) {
    const toolPageIds = getToolPageIds();

    if (toolPageIds.has(item.id)) {
      return { href:`./${encodeURIComponent(item.id)}.html`, internal:true };
    }

    return { href:getFallbackHref(item), internal:false };
  }

  function renderPage(app, allApps, notices) {
    const primary = getPrimaryAction(app);

    const primaryButton = primary
      ? `
        <a class="app-button primary"
           href="${escapeHtml(primary.url)}"
           target="_blank"
           rel="noopener">
          ${escapeHtml(primary.text)}
        </a>
      `
      : "";

    const githubButton = app.github
      ? `
        <a class="app-button"
           href="${escapeHtml(app.github)}"
           target="_blank"
           rel="noopener">
          GitHub ↗
        </a>
      `
      : "";

    const secondaryDownloadButton =
      app.downloadUrl && app.platform !== "windows"
        ? `
          <a class="app-button"
             href="${escapeHtml(app.downloadUrl)}"
             target="_blank"
             rel="noopener">
            다운로드 ↗
          </a>
        `
        : "";

    const featuresHtml = (APP_CONTENT.features || [])
      .map(feature => `
        <article class="feature-card">
          <h3>${escapeHtml(feature.title)}</h3>
          <p>${escapeHtml(feature.description)}</p>
        </article>
      `)
      .join("");

    const usageHtml = (APP_CONTENT.usage || [])
      .map(step => `<li>${escapeHtml(step)}</li>`)
      .join("");

    const noticesHtml = notices.length
      ? notices.map(notice => `
          <a class="notice-item"
             href="${escapeHtml(notice.url)}"
             target="_blank"
             rel="noopener">
            <span class="notice-date">${escapeHtml(formatDate(notice.date))}</span>
            <span class="notice-title">${escapeHtml(notice.title)}</span>
            <span class="notice-arrow">↗</span>
          </a>
        `).join("")
      : `
        <div class="notice-empty">아직 등록된 관련 공지사항이 없습니다.</div>
      `;

    const relatedApps = getRelatedApps(app, allApps);

    const relatedHtml = relatedApps
      .map(item => {
        const link = getRelatedLink(item);
        const targetAttr = link.internal
          ? 'target="_self"'
          : 'target="_blank" rel="noopener"';

        return `
          <a class="related-card"
             href="${escapeHtml(link.href)}"
             ${targetAttr}>
            <h3>${escapeHtml(item.name)}</h3>
            <p>${escapeHtml(item.description || "")}</p>
          </a>
        `;
      })
      .join("");

    const additionalHtml = APP_CONTENT.additional
      ? `
        <section class="detail-section">
          <h2>추가 안내</h2>
          <div class="detail-content">${APP_CONTENT.additional}</div>
        </section>
      `
      : "";

    $("#app-detail").innerHTML = `
      <div class="wrap">
        <div class="breadcrumb" aria-label="현재 위치">
          <a href="../index.html">ALPACA TOOLS</a>
          <span class="breadcrumb-separator">›</span>
          <a href="../tools.html">모든 도구</a>
          <span class="breadcrumb-separator">›</span>
          <span>${escapeHtml(app.name)}</span>
        </div>

        <section class="app-hero">
          <!--
            중요: 상세 페이지는 tools/ 폴더에 있으므로
            apps.json의 아이콘 경로(예: assets/icons/ac.ico)는
            반드시 ../ 를 붙여 루트 기준 경로로 보정합니다.
          -->
          <img class="app-icon"
               src="../${escapeHtml(app.icon || "")}"
               alt="${escapeHtml(app.name)} 아이콘"
               onerror="this.style.display='none';">

          <div class="app-hero-content">
            <h1>${escapeHtml(app.name)}</h1>
            <p class="app-description">${escapeHtml(app.description || "")}</p>
            <div class="app-meta">
              <span class="app-meta-item">${escapeHtml(categoryName(app.category))}</span>
              <span class="app-meta-item">${escapeHtml(platformName(app.platform))}</span>
              <span class="app-meta-item">v${escapeHtml(app.version || "-")}</span>
              <span class="app-meta-item">${escapeHtml(formatDate(app.updatedAt))} 업데이트</span>
            </div>
          </div>
        </section>

        <div class="app-actions">
          ${primaryButton}
          ${githubButton}
          ${secondaryDownloadButton}
          ${app.repoUrl ? `<a class="app-button" href="${escapeHtml(app.repoUrl)}" target="_blank" rel="noopener">소개 글 ↗</a>` : ""}
        </div>

        <section class="detail-section">
          <h2>앱 소개</h2>
          <div class="detail-content">${APP_CONTENT.intro || ""}</div>
        </section>

        <section class="detail-section">
          <h2>주요 기능</h2>
          <div class="feature-grid">${featuresHtml}</div>
        </section>

        <section class="detail-section">
          <h2>사용 방법</h2>
          <ol class="steps">${usageHtml}</ol>
        </section>

        <section class="detail-section">
          <h2>실행 환경</h2>
          <div class="environment">
            <div class="environment-item"><span class="environment-label">플랫폼</span><span class="environment-value">${escapeHtml(platformName(app.platform))}</span></div>
            <div class="environment-item"><span class="environment-label">버전</span><span class="environment-value">v${escapeHtml(app.version || "-")}</span></div>
            <div class="environment-item"><span class="environment-label">최근 업데이트</span><span class="environment-value">${escapeHtml(formatDate(app.updatedAt))}</span></div>
          </div>
        </section>

        ${additionalHtml}

        <section class="detail-section">
          <h2>관련 공지사항</h2>
          <div class="notice-list">${noticesHtml}</div>
        </section>

        <section class="detail-section">
          <h2>관련 도구</h2>
          <div class="related-grid">
            ${relatedHtml || '<div class="detail-content"><p>같은 카테고리의 관련 도구가 없습니다.</p></div>'}
          </div>
        </section>

        <div class="bottom-cta">
          <h2>${escapeHtml(app.name)}를 사용해 보세요.</h2>
          <div class="app-actions">
            ${primaryButton}
          </div>
        </div>

        <a class="back-link" href="../tools.html">← 도구 목록으로 돌아가기</a>
      </div>
    `;
  }

  async function loadJson(path) {
    const response = await fetch(path);
    if (!response.ok) {
      throw new Error(`${path} 불러오기 실패`);
    }
    return response.json();
  }

  async function loadData() {
    try {
      const [appsData, noticesData] = await Promise.all([
        loadJson("../apps.json"),
        loadJson("../notice.json")
      ]);

      const allApps = Array.isArray(appsData)
        ? appsData
        : (appsData.apps || []);

      const allNotices = Array.isArray(noticesData)
        ? noticesData
        : (noticesData.notices || []);

      const app = allApps.find(item => item.id === APP_ID);

      if (!app) {
        throw new Error(`apps.json에서 "${APP_ID}" 앱을 찾을 수 없습니다.`);
      }

      const relatedNotices = allNotices
        .filter(notice => notice.appId === APP_ID)
        .sort((a, b) => String(b.date).localeCompare(String(a.date)));

      renderPage(app, allApps, relatedNotices);
    } catch (error) {
      console.error(error);

      $("#app-detail").innerHTML = `
        <div class="wrap">
          <div class="error-message">
            앱 정보를 불러오지 못했습니다.
            <small>${escapeHtml(error.message)}</small>
          </div>
        </div>
      `;
    }
  }

  /*
   * 모바일 햄버거 메뉴 토글은 partials/header.html에 포함된
   * 공통 스크립트가 처리합니다.
   */
  loadData();
</script>

</body>
</html>
