<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="PNG Background Eraser 앱 상세 페이지"><title>PNG Background Eraser | ALPACA TOOLS</title><link rel="stylesheet" href="../style.css">
<style>
.breadcrumb{padding-top:28px;font-size:13px;color:var(--muted)}.breadcrumb a:hover{color:var(--ink)}.breadcrumb-separator{margin:0 7px;color:#B7B8B5}.app-hero{display:flex;align-items:center;gap:24px;padding:30px 0 28px}.app-icon{width:88px;height:88px;flex:0 0 88px;border:1px solid var(--line);border-radius:20px;background:var(--surface)}.app-icon-emoji{display:flex;align-items:center;justify-content:center;font-size:48px}.app-hero-content{min-width:0}.app-hero h1{margin:0 0 8px;font-size:clamp(30px,4.2vw,44px);font-weight:800;line-height:1.2}.app-description{margin:0 0 13px;max-width:700px;color:var(--muted);font-size:16px}.app-meta{display:flex;flex-wrap:wrap;gap:5px 12px;color:var(--muted);font-size:13px}.app-meta-item+.app-meta-item:before{content:"·";margin-right:12px}.app-actions{display:flex;flex-wrap:wrap;gap:9px;padding:0 0 46px}.app-button{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:13.5px;font-weight:700}.app-button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}.app-button.primary:hover{background:var(--accent);border-color:var(--accent)}.detail-section{border-top:1px solid var(--line);padding:48px 0}.detail-section h2{margin:0 0 15px;font-size:21px;font-weight:800}.detail-content{max-width:720px;color:var(--muted);font-size:14.5px}.detail-content p{margin:0 0 12px}.feature-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:20px}.feature-card{padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}.feature-card h3{margin:0 0 7px;font-size:15px}.feature-card p{margin:0;color:var(--muted);font-size:13.5px}.steps{max-width:720px;margin:20px 0 0;padding:0;list-style:none;counter-reset:step}.steps li{position:relative;padding:1px 0 16px 40px;color:var(--muted);font-size:14px}.steps li:before{content:counter(step);counter-increment:step;position:absolute;left:0;top:0;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--ink);color:var(--paper);font-size:12px}.environment{max-width:720px;margin-top:18px;border-top:1px solid var(--line)}.environment-item{display:flex;justify-content:space-between;gap:20px;padding:13px 4px;border-bottom:1px solid var(--line);font-size:14px}.environment-label{color:var(--muted)}.environment-value{text-align:right;font-weight:700}.related-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:20px}.related-card{display:block;padding:17px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}.related-card h3{margin:0 0 6px;font-size:14.5px}.related-card p{margin:0;color:var(--muted);font-size:12.5px}.back-link{display:inline-flex;margin:0 0 54px;color:var(--muted);font-size:13.5px;font-weight:700}.loading{padding:80px 0;text-align:center;color:var(--muted)}@media(max-width:700px){.app-hero{align-items:flex-start;gap:17px}.app-icon{width:70px;height:70px;flex-basis:70px}.app-icon-emoji{font-size:38px}.feature-grid,.related-grid{grid-template-columns:1fr}}@media(max-width:500px){.app-hero{display:block;padding-top:22px}.app-icon{margin-bottom:15px}.app-actions .app-button{flex:1}}
</style></head>
<body><!--#include header--><main id="app-detail"><div class="wrap"><div class="loading">앱 정보를 불러오는 중입니다.</div></div></main><!--#include footer-->
<script>
const APP_ID="png-be";const CONTENT={intro:`<p>PNG Background Eraser는 PNG 이미지 파일의 배경을 지우는 작업을 브라우저에서 수행할 수 있도록 만든 웹 도구입니다.</p><p>이미지에서 불필요한 배경을 제거한 뒤 투명 배경 이미지를 활용해야 하는 작업에 간편하게 사용할 수 있습니다.</p>`,features:[{title:"PNG 배경 제거",description:"PNG 이미지의 배경을 제거하여 필요한 피사체를 분리할 수 있습니다."},{title:"브라우저 기반 실행",description:"별도의 프로그램을 설치하지 않고 웹 브라우저에서 바로 실행할 수 있습니다."},{title:"이미지 미리보기",description:"작업 대상 이미지를 확인하면서 배경 제거 결과를 확인할 수 있습니다."},{title:"투명 배경 활용",description:"배경이 제거된 이미지를 디자인, 문서, 웹 콘텐츠 등 다양한 용도로 활용할 수 있습니다."}],usage:["바로 열기 버튼을 눌러 PNG Background Eraser를 실행합니다.","배경을 제거할 PNG 이미지 파일을 선택합니다.","배경 제거 결과를 확인한 뒤 결과 이미지를 저장합니다."],additional:`<p>이미지 종류와 배경의 형태에 따라 배경 제거 결과가 달라질 수 있습니다. 중요한 작업에는 결과 이미지를 저장하기 전에 반드시 확인하는 것을 권장합니다.</p>`};
const $=s=>document.querySelector(s);const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;");const date=v=>v?String(v).replace(/-/g,"."):"-";const cat=v=>({work:"업무",life:"생활",dev:"개발자"})[v]||v||"-";const plat=v=>({web:"Web",windows:"Windows"})[v]||v||"-";
function href(x){const pages=new Set(["ac","ae","aie-exe","aie-web","an","EdgeCM","md-ve","pdf2jpg","png-be","retirement-age-calc"]);return pages.has(x.id)?`./${encodeURIComponent(x.id)}.html`:(x.repoUrl||x.url||x.downloadUrl||x.github||"../tools.html")};function icon(a){const i=String(a.icon||"").trim();if(/\.(png|jpe?g|gif|webp|svg|ico)(\?.*)?$/i.test(i))return `<img class="app-icon" src="../${i.replace(/^\.\//,"")}" alt="${esc(a.name)} 아이콘">`;return `<div class="app-icon app-icon-emoji" role="img" aria-label="${esc(a.name)} 아이콘">${esc(i||"🛠️")}</div>`}
async function load(){try{const[a,n]=await Promise.all([fetch("../apps.json").then(r=>r.json()),fetch("../notice.json").then(r=>r.json())]);const apps=a.apps||a,ns=n.notices||n,a1=apps.find(x=>x.id===APP_ID);if(!a1)throw Error("앱 정보를 찾을 수 없습니다.");const rel=apps.filter(x=>x.id!==a1.id&&x.category===a1.category).slice(0,3),notes=ns.filter(x=>x.appId===APP_ID);$("#app-detail").innerHTML=`<div class="wrap"><div class="breadcrumb"><a href="../index.html">ALPACA TOOLS</a><span class="breadcrumb-separator">›</span><a href="../tools.html">모든 도구</a><span class="breadcrumb-separator">›</span><span>${esc(a1.name)}</span></div><section class="app-hero">${icon(a1)}<div class="app-hero-content"><h1>${esc(a1.name)}</h1><p class="app-description">${esc(a1.description)}</p><div class="app-meta"><span class="app-meta-item">${esc(cat(a1.category))}</span><span class="app-meta-item">${esc(plat(a1.platform))}</span><span class="app-meta-item">v${esc(a1.version)}</span><span class="app-meta-item">${esc(date(a1.updatedAt))} 업데이트</span></div></div></section><div class="app-actions"><a class="app-button primary" href="${esc(a1.url)}" target="_blank" rel="noopener">바로 열기 ↗</a><a class="app-button" href="${esc(a1.github)}" target="_blank" rel="noopener">GitHub ↗</a></div><section class="detail-section"><h2>앱 소개</h2><div class="detail-content">${CONTENT.intro}</div></section><section class="detail-section"><h2>주요 기능</h2><div class="feature-grid">${CONTENT.features.map(f=>`<article class="feature-card"><h3>${esc(f.title)}</h3><p>${esc(f.description)}</p></article>`).join("")}</div></section><section class="detail-section"><h2>사용 방법</h2><ol class="steps">${CONTENT.usage.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></section><section class="detail-section"><h2>실행 환경</h2><div class="environment"><div class="environment-item"><span class="environment-label">플랫폼</span><span class="environment-value">${esc(plat(a1.platform))}</span></div><div class="environment-item"><span class="environment-label">버전</span><span class="environment-value">v${esc(a1.version)}</span></div><div class="environment-item"><span class="environment-label">최근 업데이트</span><span class="environment-value">${esc(date(a1.updatedAt))}</span></div></div></section><section class="detail-section"><h2>추가 안내</h2><div class="detail-content">${CONTENT.additional}</div></section><section class="detail-section"><h2>관련 공지사항</h2><div class="detail-content">${notes.length?notes.map(x=>`<p><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(date(x.date))} · ${esc(x.title)} ↗</a></p>`).join(""):"<p>아직 등록된 관련 공지사항이 없습니다.</p>"}</div></section><section class="detail-section"><h2>관련 도구</h2><div class="related-grid">${rel.map(x=>{const h=href(x);return `<a class="related-card" href="${esc(h)}" ${h.startsWith("./")?'target="_self"':'target="_blank" rel="noopener"'}><h3>${esc(x.name)}</h3><p>${esc(x.description||"")}</p></a>`}).join("")}</div></section><a class="back-link" href="../tools.html">← 도구 목록으로 돌아가기</a></div>`}catch(e){$("#app-detail").innerHTML=`<div class="wrap"><div class="loading">앱 정보를 불러오지 못했습니다.<br>${esc(e.message)}</div></div>`}}load();
</script></body></html>
