<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="엣지(Edge) 컬렉션 매니저 - Microsoft Edge에서 사라진 컬렉션 기능을 대체할 수 있는 Windows 프로그램">
  <title>엣지(Edge) 컬렉션 매니저 | ALPACA TOOLS</title>

  <link rel="stylesheet" href="../style.css">

  <style>
    .breadcrumb{padding-top:28px;font-size:13px;color:var(--muted)}
    .breadcrumb a:hover{color:var(--ink)}
    .breadcrumb-separator{margin:0 7px;color:#B7B8B5}
    .app-hero{display:flex;align-items:center;gap:24px;padding:30px 0 28px}
    .app-icon{width:88px;height:88px;flex:0 0 88px;object-fit:contain;border:1px solid var(--line);border-radius:20px;background:var(--surface)}
    .app-hero-content{min-width:0}
    .app-hero h1{margin:0 0 8px;font-size:clamp(30px,4.2vw,44px);font-weight:800;letter-spacing:-.025em;line-height:1.2}
    .app-description{margin:0 0 13px;max-width:700px;color:var(--muted);font-size:16px}
    .app-meta{display:flex;flex-wrap:wrap;gap:5px 12px;color:var(--muted);font-size:13px}
    .app-meta-item + .app-meta-item::before{content:"·";margin-right:12px;color:#B7B8B5}
    .app-actions{display:flex;flex-wrap:wrap;gap:9px;padding:0 0 46px}
    .app-button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:13.5px;font-weight:700;transition:background .15s,border-color .15s,color .15s}
    .app-button:hover{border-color:#B9B9B5}
    .app-button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
    .app-button.primary:hover{background:var(--accent);border-color:var(--accent)}
    .detail-section{border-top:1px solid var(--line);padding:48px 0}
    .detail-section h2{margin:0 0 15px;font-size:21px;font-weight:800;letter-spacing:-.01em}
    .detail-content{max-width:720px;color:var(--muted);font-size:14.5px}
    .detail-content p{margin:0 0 12px}.detail-content p:last-child{margin-bottom:0}
    .feature-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:20px}
    .feature-card{padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
    .feature-card h3{margin:0 0 7px;font-size:15px;font-weight:800}
    .feature-card p{margin:0;color:var(--muted);font-size:13.5px}
    .steps{max-width:720px;margin:20px 0 0;padding:0;list-style:none;counter-reset:step}
    .steps li{position:relative;min-height:26px;padding:1px 0 16px 40px;color:var(--muted);font-size:14px}
    .steps li::before{content:counter(step);counter-increment:step;position:absolute;left:0;top:0;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--ink);color:var(--paper);font-size:12px;font-weight:800}
    .environment{max-width:720px;margin-top:18px;border-top:1px solid var(--line)}
    .environment-item{display:flex;justify-content:space-between;gap:20px;padding:13px 4px;border-bottom:1px solid var(--line);font-size:14px}
    .environment-label{color:var(--muted)}.environment-value{text-align:right;font-weight:700}
    .notice-list{max-width:820px;margin-top:18px;border-top:1px solid var(--line)}
    .notice-item{display:grid;grid-template-columns:92px minmax(0,1fr) 18px;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line);font-size:14px}
    .notice-date{color:var(--muted);font-size:12.5px}.notice-title{min-width:0;font-weight:700}.notice-arrow{color:var(--muted);text-align:right}.notice-item:hover .notice-title{color:var(--accent)}
    .notice-empty{padding:24px 4px;color:var(--muted);font-size:14px}
    .related-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:20px}
    .related-card{display:block;padding:17px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
    .related-card:hover{border-color:#B9B9B5}.related-card h3{margin:0 0 6px;font-size:14.5px}.related-card p{margin:0;color:var(--muted);font-size:12.5px}
    .bottom-cta{border-top:1px solid var(--line);padding:48px 0 56px;text-align:center}.bottom-cta h2{margin:0 0 17px;font-size:21px;font-weight:800}.bottom-cta .app-actions{justify-content:center;padding-bottom:0}
    .back-link{display:inline-flex;align-items:center;gap:5px;margin:0 0 54px;color:var(--muted);font-size:13.5px;font-weight:700}.back-link:hover{color:var(--ink)}
    .loading,.error-message{padding:80px 0;text-align:center;color:var(--muted);font-size:14px}.error-message small{display:block;margin-top:8px;color:var(--muted)}
    @media (max-width:700px){.app-hero{align-items:flex-start;gap:17px}.app-icon{width:70px;height:70px;flex-basis:70px;border-radius:16px}.feature-grid,.related-grid{grid-template-columns:1fr}.environment{max-width:none}}
    @media (max-width:500px){.breadcrumb{padding-top:20px;font-size:12px}.app-hero{display:block;padding-top:22px}.app-icon{margin-bottom:15px}.app-description{font-size:14.5px}.app-actions .app-button{flex:1}.notice-item{grid-template-columns:72px minmax(0,1fr) 14px;gap:9px}.notice-title{font-size:13.5px}.environment-item{font-size:13.5px}}
  </style>
</head>

<body>
<!--#include header-->

<main id="app-detail">
  <div class="wrap">
    <div class="loading">앱 정보를 불러오는 중입니다.</div>
  </div>
</main>

<!--#include footer-->

<script>
  const APP_ID = "EdgeCM";

  const APP_CONTENT = {
    intro: `
      <p>엣지(Edge) 컬렉션 매니저는 Microsoft Edge에서 사라진 컬렉션 기능을 대신하여 웹에서 찾은 자료와 링크를 보다 편리하게 관리할 수 있도록 만든 Windows 프로그램입니다.</p>
      <p>웹 브라우징 중 저장해 두고 싶은 페이지를 별도의 목록으로 관리할 수 있어, 업무 자료 조사나 관심 있는 웹페이지를 모아두는 용도로 활용할 수 있습니다.</p>
      <p>기존 Microsoft Edge의 컬렉션 기능을 사용하던 사용자에게 익숙한 방식으로 자료를 관리할 수 있도록 구성한 것이 특징입니다.</p>
    `,

    features: [
      {
        title: "웹 자료 저장",
        description: "다시 확인하고 싶은 웹페이지의 주소를 저장하여 별도의 목록으로 관리할 수 있습니다."
      },
      {
        title: "컬렉션 방식의 자료 관리",
        description: "웹에서 수집한 링크를 한곳에 모아 관리할 수 있어 업무 자료나 참고 페이지를 정리하기 편리합니다."
      },
      {
        title: "Windows 프로그램",
        description: "Windows 환경에서 실행할 수 있는 EXE 프로그램으로 제공되어 별도의 웹페이지 접속 없이 사용할 수 있습니다."
      },
      {
        title: "간편한 웹페이지 접근",
        description: "저장한 웹페이지를 다시 열어 필요한 자료를 빠르게 확인할 수 있습니다."
      }
    ],

    usage: [
      "GitHub Releases에서 최신 버전의 엣지(Edge) 컬렉션 매니저를 다운로드합니다.",
      "다운로드한 프로그램을 Windows에서 실행합니다.",
      "웹에서 다시 확인하고 싶은 페이지의 정보를 컬렉션에 저장합니다.",
      "저장된 자료 목록에서 원하는 항목을 선택하여 해당 웹페이지를 다시 확인합니다."
    ],

    additional: `
      <p>엣지(Edge) 컬렉션 매니저는 Microsoft Edge 자체의 기능을 수정하는 프로그램이 아니라, 별도의 Windows 프로그램으로 컬렉션과 유사한 자료 관리 기능을 제공하는 도구입니다.</p>
      <p>현재 <strong>v1.0</strong>으로 제공되고 있으며, 프로그램의 소스코드는 GitHub 저장소에서 확인할 수 있습니다.</p>
    `
  };

  const $ = (selector) => document.querySelector(selector);

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/\"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function formatDate(value) {
    if (!value) return "-";
    return String(value).replace(/-/g, ".");
  }

  function categoryName(category) {
    const names = { work: "업무", life: "생활", dev: "개발자" };
    return names[category] || category || "-";
  }

  function platformName(platform) {
    const names = { web: "Web", windows: "Windows" };
    return names[platform] || platform || "-";
  }

  function getPrimaryAction(app) {
    if (app.platform === "web" && app.url) return { text: "바로 열기 ↗", url: app.url };
    if (app.platform === "windows" && app.downloadUrl) return { text: "다운로드 ↗", url: app.downloadUrl };
    return null;
  }

  function getRelatedApps(app, allApps) {
    return allApps
      .filter(item => item.id !== app.id)
      .filter(item => item.category === app.category)
      .slice(0, 3);
  }

  async function loadJson(path) {
    const response = await fetch(path);
    if (!response.ok) throw new Error(`${path} 불러오기에 실패했습니다.`);
    return response.json();
  }

  function getRelatedLink(app) {
    const detailUrl = `./${app.id}.html`;
    if (app.id) return detailUrl;
    return app.repoUrl || app.url || app.downloadUrl || app.github || "#";
  }

  function renderFeatures(features) {
    return features.map(feature => `
      <article class="feature-card">
        <h3>${escapeHtml(feature.title)}</h3>
        <p>${escapeHtml(feature.description)}</p>
      </article>
    `).join("");
  }

  function renderSteps(steps) {
    return steps.map(step => `<li>${escapeHtml(step)}</li>`).join("");
  }

  function renderEnvironment(app) {
    return `
      <div class="environment">
        <div class="environment-item"><span class="environment-label">플랫폼</span><span class="environment-value">${escapeHtml(platformName(app.platform))}</span></div>
        <div class="environment-item"><span class="environment-label">버전</span><span class="environment-value">v${escapeHtml(app.version)}</span></div>
        <div class="environment-item"><span class="environment-label">최근 업데이트</span><span class="environment-value">${escapeHtml(formatDate(app.updatedAt))}</span></div>
        <div class="environment-item"><span class="environment-label">카테고리</span><span class="environment-value">${escapeHtml(categoryName(app.category))}</span></div>
      </div>
    `;
  }

  function renderNotices(notices) {
    const related = notices
      .filter(notice => notice.appId === APP_ID)
      .sort((a, b) => String(b.date).localeCompare(String(a.date)));

    if (!related.length) return `<div class="notice-empty">등록된 관련 공지사항이 없습니다.</div>`;

    return related.map(notice => `
      <a class="notice-item" href="${escapeHtml(notice.url)}" target="_blank" rel="noopener noreferrer">
        <span class="notice-date">${escapeHtml(formatDate(notice.date))}</span>
        <span class="notice-title">${escapeHtml(notice.title)}</span>
        <span class="notice-arrow">↗</span>
      </a>
    `).join("");
  }

  function renderRelated(app, apps) {
    const related = getRelatedApps(app, apps);
    if (!related.length) return `<div class="notice-empty">관련 도구가 없습니다.</div>`;

    return related.map(item => `
      <a class="related-card" href="${escapeHtml(getRelatedLink(item))}">
        <h3>${escapeHtml(item.name)}</h3>
        <p>${escapeHtml(item.description)}</p>
      </a>
    `).join("");
  }

  function renderPage(app, apps, notices) {
    const primary = getPrimaryAction(app);
    const actions = [];

    if (primary) {
      actions.push(`<a class="app-button primary" href="${escapeHtml(primary.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(primary.text)}</a>`);
    }
    if (app.github) {
      actions.push(`<a class="app-button" href="${escapeHtml(app.github)}" target="_blank" rel="noopener noreferrer">GitHub ↗</a>`);
    }
    if (app.repoUrl) {
      actions.push(`<a class="app-button" href="${escapeHtml(app.repoUrl)}" target="_blank" rel="noopener noreferrer">소개 글 ↗</a>`);
    }

    document.title = `${app.name} | ALPACA TOOLS`;
    const description = document.querySelector('meta[name="description"]');
    if (description) description.setAttribute("content", `${app.name} - ${app.description}`);

    $("#app-detail").innerHTML = `
      <div class="wrap">
        <div class="breadcrumb">
          <a href="../index.html">ALPACA TOOLS</a>
          <span class="breadcrumb-separator">/</span>
          <a href="../tools.html">도구</a>
          <span class="breadcrumb-separator">/</span>
          <span>${escapeHtml(app.name)}</span>
        </div>

        <section class="app-hero">
          <img class="app-icon" src="../${escapeHtml(app.icon)}" alt="${escapeHtml(app.name)} 아이콘">
          <div class="app-hero-content">
            <h1>${escapeHtml(app.name)}</h1>
            <p class="app-description">${escapeHtml(app.description)}</p>
            <div class="app-meta">
              <span class="app-meta-item">${escapeHtml(categoryName(app.category))}</span>
              <span class="app-meta-item">${escapeHtml(platformName(app.platform))}</span>
              <span class="app-meta-item">v${escapeHtml(app.version)}</span>
              <span class="app-meta-item">${escapeHtml(formatDate(app.updatedAt))} 업데이트</span>
            </div>
          </div>
        </section>

        <div class="app-actions">${actions.join("")}</div>

        <section class="detail-section">
          <h2>알파카(Edge) 컬렉션 매니저 소개</h2>
          <div class="detail-content">${APP_CONTENT.intro}</div>
        </section>

        <section class="detail-section">
          <h2>주요 기능</h2>
          <div class="feature-grid">${renderFeatures(APP_CONTENT.features)}</div>
        </section>

        <section class="detail-section">
          <h2>사용 방법</h2>
          <ol class="steps">${renderSteps(APP_CONTENT.usage)}</ol>
        </section>

        <section class="detail-section">
          <h2>실행 환경</h2>
          ${renderEnvironment(app)}
        </section>

        <section class="detail-section">
          <h2>추가 안내</h2>
          <div class="detail-content">${APP_CONTENT.additional}</div>
        </section>

        <section class="detail-section">
          <h2>관련 공지사항</h2>
          <div class="notice-list">${renderNotices(notices)}</div>
        </section>

        <section class="detail-section">
          <h2>관련 도구</h2>
          <div class="related-grid">${renderRelated(app, apps)}</div>
        </section>

        <div class="bottom-cta">
          <h2>엣지(Edge) 컬렉션 매니저를 사용해 보세요.</h2>
          <div class="app-actions">${actions.join("")}</div>
        </div>

        <a class="back-link" href="../tools.html">← 도구 목록으로 돌아가기</a>
      </div>
    `;
  }

  async function init() {
    try {
      const [appData, noticeData] = await Promise.all([
        loadJson("../apps.json"),
        loadJson("../notice.json")
      ]);

      const apps = Array.isArray(appData.apps) ? appData.apps : [];
      const notices = Array.isArray(noticeData.notices) ? noticeData.notices : [];
      const app = apps.find(item => item.id === APP_ID);

      if (!app) throw new Error(`apps.json에서 ${APP_ID} 앱을 찾을 수 없습니다.`);
      renderPage(app, apps, notices);
    } catch (error) {
      console.error(error);
      $("#app-detail").innerHTML = `
        <div class="wrap">
          <div class="error-message">
            앱 정보를 불러오지 못했습니다.
            <small>${escapeHtml(error.message)}</small>
          </div>
        </div>
      `;
    }
  }

  init();
</script>
</body>
</html>
