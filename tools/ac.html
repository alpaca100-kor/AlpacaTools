<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="알파카 달력 - 월별 및 1년 전체 날짜를 간편하게 확인할 수 있는 ALPACA TOOLS 웹 달력">
  <title>알파카 달력 | ALPACA TOOLS</title>
  <link rel="stylesheet" href="../style.css">

  <style>
    :root{--line:#ddd;--muted:#6b6b68;--ink:#20201e;--paper:#fff;--surface:#fafafa;--accent:#555}
    .breadcrumb{padding-top:28px;font-size:13px;color:var(--muted)}.breadcrumb a{color:inherit}.breadcrumb a:hover{color:var(--ink)}.breadcrumb-separator{margin:0 7px;color:#B7B8B5}
    .app-hero{display:flex;align-items:center;gap:24px;padding:30px 0 28px}.app-icon{width:88px;height:88px;flex:0 0 88px;object-fit:contain;border:1px solid var(--line);border-radius:20px;background:var(--surface)}.app-hero-content{min-width:0}.app-hero h1{margin:0 0 8px;font-size:clamp(30px,4.2vw,44px);font-weight:800;letter-spacing:-.025em;line-height:1.2}.app-description{margin:0 0 13px;max-width:700px;color:var(--muted);font-size:16px}.app-meta{display:flex;flex-wrap:wrap;gap:5px 12px;color:var(--muted);font-size:13px}.app-meta-item+.app-meta-item:before{content:"·";margin-right:12px;color:#B7B8B5}
    .app-actions{display:flex;flex-wrap:wrap;gap:9px;padding:0 0 46px}.app-button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:13.5px;font-weight:700}.app-button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
    .detail-section{border-top:1px solid var(--line);padding:48px 0}.detail-section h2{margin:0 0 15px;font-size:21px;font-weight:800}.detail-content{max-width:720px;color:var(--muted);font-size:14.5px}.detail-content p{margin:0 0 12px}.feature-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:20px}.feature-card{padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}.feature-card h3{margin:0 0 7px;font-size:15px}.feature-card p{margin:0;color:var(--muted);font-size:13.5px}
    .steps{max-width:720px;margin:20px 0 0;padding:0;list-style:none;counter-reset:step}.steps li{position:relative;min-height:26px;padding:1px 0 16px 40px;color:var(--muted);font-size:14px}.steps li:before{content:counter(step);counter-increment:step;position:absolute;left:0;top:0;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--ink);color:var(--paper);font-size:12px;font-weight:800}
    .environment{max-width:720px;margin-top:18px;border-top:1px solid var(--line)}.environment-item{display:flex;justify-content:space-between;gap:20px;padding:13px 4px;border-bottom:1px solid var(--line);font-size:14px}.environment-label{color:var(--muted)}.environment-value{text-align:right;font-weight:700}
    .notice-list{max-width:820px;margin-top:18px;border-top:1px solid var(--line)}.notice-item{display:grid;grid-template-columns:92px minmax(0,1fr) 18px;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line);font-size:14px}.notice-date{color:var(--muted);font-size:12.5px}.notice-title{min-width:0;font-weight:700}.notice-arrow{color:var(--muted);text-align:right}
    .related-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:20px}.related-card{display:block;padding:17px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}.related-card h3{margin:0 0 6px;font-size:14.5px}.related-card p{margin:0;color:var(--muted);font-size:12.5px}.bottom-cta{border-top:1px solid var(--line);padding:48px 0 56px;text-align:center}.back-link{display:inline-flex;gap:5px;margin:0 0 54px;color:var(--muted);font-size:13.5px;font-weight:700}.loading,.error-message{padding:80px 0;text-align:center;color:var(--muted);font-size:14px}
    @media(max-width:700px){.app-hero{align-items:flex-start;gap:17px}.app-icon{width:70px;height:70px;flex-basis:70px;border-radius:16px}.feature-grid,.related-grid{grid-template-columns:1fr}}@media(max-width:500px){.app-hero{display:block;padding-top:22px}.app-icon{margin-bottom:15px}.app-description{font-size:14.5px}.app-actions .app-button{flex:1}.notice-item{grid-template-columns:72px minmax(0,1fr) 14px;gap:9px}}
  </style>
</head>
<body>
<!--#include header-->
<main id="app-detail"><div class="wrap"><div class="loading">앱 정보를 불러오는 중입니다.</div></div></main>
<!--#include footer-->
<script>
const APP_ID = "ac";
const APP_CONTENT = {
  intro: `<p>알파카 달력은 웹 브라우저에서 월별 또는 1년 전체의 날짜를 간편하게 확인할 수 있도록 만든 달력입니다.</p><p>월별 보기와 연간 보기 사이를 전환할 수 있으며, 현재 날짜를 빠르게 확인하거나 원하는 연도와 월로 이동할 수 있습니다.</p><p>라이트 모드와 다크 모드를 지원하고 공휴일이 표시되는 날짜의 정보를 확인할 수 있도록 구성되어 있습니다.</p>`,
  additional: `<p>별도의 프로그램 설치 없이 웹 브라우저에서 사용할 수 있습니다.</p><p>현재 <strong>v1.0</strong>으로 제공되고 있으며 자세한 소스코드는 GitHub에서 확인할 수 있습니다.</p>`
};
const $ = (selector) => document.querySelector(selector);
function escapeHtml(value){return String(value ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}
function formatDate(value){return value ? String(value).replace(/-/g,".") : "-";}
function categoryName(value){return ({work:"업무",life:"생활",dev:"개발자"}[value] || value || "-");}
function platformName(value){return ({web:"Web",windows:"Windows"}[value] || value || "-");}
async function loadJson(path){const response=await fetch(path);if(!response.ok)throw new Error(`${path} 불러오기 실패`);return response.json();}
function getPrimaryAction(app){if(app.platform==="web"&&app.url)return `<a class="app-button primary" href="${escapeHtml(app.url)}" target="_blank" rel="noopener">바로 열기 ↗</a>`;if(app.platform==="windows"&&app.downloadUrl)return `<a class="app-button primary" href="${escapeHtml(app.downloadUrl)}" target="_blank" rel="noopener">다운로드 ↗</a>`;return "";}
function getRelatedApps(app,apps){return apps.filter(item=>item.id!==app.id).filter(item=>item.category===app.category).slice(0,3);}
function renderPage(app,apps,notices){
  const primaryAction=getPrimaryAction(app);
  const github=app.github?`<a class="app-button" href="${escapeHtml(app.github)}" target="_blank" rel="noopener">GitHub ↗</a>`:"";
  const introLink=app.repoUrl?`<a class="app-button" href="${escapeHtml(app.repoUrl)}" target="_blank" rel="noopener">소개 글 ↗</a>`:"";
  const relatedNotices=notices.filter(notice=>notice.appId===app.id).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const noticesHtml=relatedNotices.length?relatedNotices.map(notice=>`<a class="notice-item" href="${escapeHtml(notice.url)}" target="_blank" rel="noopener"><span class="notice-date">${formatDate(notice.date)}</span><span class="notice-title">${escapeHtml(notice.title)}</span><span class="notice-arrow">↗</span></a>`).join(""): `<div class="notice-item"><span class="notice-title">등록된 관련 공지사항이 없습니다.</span></div>`;
  const relatedApps=getRelatedApps(app,apps);
  const relatedHtml=relatedApps.length?relatedApps.map(item=>`<a class="related-card" href="./${encodeURIComponent(item.id)}.html"><h3>${escapeHtml(item.name)}</h3><p>${escapeHtml(item.description)}</p></a>`).join(""):`<div class="detail-content"><p>같은 카테고리의 관련 도구가 없습니다.</p></div>`;
  $("#app-detail").innerHTML=`<div class="wrap"><div class="breadcrumb"><a href="../tools.html">도구</a><span class="breadcrumb-separator">/</span><span>${escapeHtml(app.name)}</span></div><section class="app-hero"><img class="app-icon" src="../${escapeHtml(app.icon||"")}" alt="${escapeHtml(app.name)} 아이콘" onerror="this.style.display='none';"><div class="app-hero-content"><h1>${escapeHtml(app.name)}</h1><p class="app-description">${escapeHtml(app.description)}</p><div class="app-meta"><span class="app-meta-item">${categoryName(app.category)}</span><span class="app-meta-item">${platformName(app.platform)}</span><span class="app-meta-item">v${escapeHtml(app.version)}</span><span class="app-meta-item">${formatDate(app.updatedAt)} 업데이트</span></div></div></section><div class="app-actions">${primaryAction}${github}${introLink}</div><section class="detail-section"><h2>앱 소개</h2><div class="detail-content">${APP_CONTENT.intro}</div></section><section class="detail-section"><h2>주요 기능</h2><div class="feature-grid"><article class="feature-card"><h3>월별 달력</h3><p>한 달의 날짜를 한눈에 확인하고 이전 달과 다음 달을 탐색할 수 있습니다.</p></article><article class="feature-card"><h3>1년 전체 보기</h3><p>한 해의 날짜를 연간 달력 형태로 확인할 수 있습니다.</p></article><article class="feature-card"><h3>오늘 날짜 바로가기</h3><p>현재 날짜를 빠르게 확인하고 오늘 기준으로 달력을 이동할 수 있습니다.</p></article><article class="feature-card"><h3>연도·월 이동</h3><p>원하는 연도와 월을 선택하여 해당 시점의 달력을 확인할 수 있습니다.</p></article><article class="feature-card"><h3>공휴일 확인</h3><p>공휴일이 표시된 날짜를 구분하고 관련 정보를 확인할 수 있습니다.</p></article><article class="feature-card"><h3>라이트·다크 모드</h3><p>화면 환경에 맞게 테마를 전환할 수 있습니다.</p></article></div></section><section class="detail-section"><h2>사용 방법</h2><ol class="steps"><li>알파카 달력 페이지를 열어 현재 날짜를 기준으로 달력을 확인합니다.</li><li>월별 보기에서 원하는 연도와 월로 이동합니다.</li><li>필요한 경우 연간 보기로 전환하여 한 해의 날짜를 확인합니다.</li><li>공휴일이 표시된 날짜를 선택하여 관련 정보를 확인합니다.</li><li>테마 버튼으로 라이트 모드와 다크 모드를 전환합니다.</li></ol></section><section class="detail-section"><h2>실행 환경</h2><div class="environment"><div class="environment-item"><span class="environment-label">플랫폼</span><span class="environment-value">${platformName(app.platform)}</span></div><div class="environment-item"><span class="environment-label">버전</span><span class="environment-value">v${escapeHtml(app.version)}</span></div><div class="environment-item"><span class="environment-label">최근 업데이트</span><span class="environment-value">${formatDate(app.updatedAt)}</span></div><div class="environment-item"><span class="environment-label">배포 형태</span><span class="environment-value">Web</span></div></div></section><section class="detail-section"><h2>추가 안내</h2><div class="detail-content">${APP_CONTENT.additional}</div></section><section class="detail-section"><h2>관련 공지사항</h2><div class="notice-list">${noticesHtml}</div></section><section class="detail-section"><h2>관련 도구</h2><div class="related-grid">${relatedHtml}</div></section><div class="bottom-cta"><h2>${escapeHtml(app.name)}를 사용해 보세요.</h2><div class="app-actions">${primaryAction}</div></div><a class="back-link" href="../tools.html">← 도구 목록으로 돌아가기</a></div>`;
}
Promise.all([loadJson("../apps.json"),loadJson("../notice.json")]).then(([appsData,noticesData])=>{const apps=Array.isArray(appsData)?appsData:(appsData.apps||[]);const notices=Array.isArray(noticesData)?noticesData:(noticesData.notices||[]);const app=apps.find(item=>item.id===APP_ID);if(!app)throw new Error(`apps.json에서 "${APP_ID}" 앱을 찾을 수 없습니다.`);renderPage(app,apps,notices);}).catch(error=>{$("#app-detail").innerHTML=`<div class="wrap"><div class="error-message">앱 정보를 불러오지 못했습니다.<small>${escapeHtml(error.message)}</small></div></div>`;console.error(error);});
</script>
</body>
</html>
