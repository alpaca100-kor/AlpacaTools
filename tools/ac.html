<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="알파카 달력 - 월별 및 1년 전체 날짜를 간편하게 확인할 수 있는 ALPACA TOOLS 웹 달력">
  <title>알파카 달력 | ALPACA TOOLS</title>

  <!-- tools 폴더에서 루트의 공통 스타일을 사용 -->
  <link rel="stylesheet" href="../style.css">

  <style>
    /* =========================================================
       ALPACA TOOLS - App Detail Page
       이 영역은 앱 상세 페이지에서만 사용하는 추가 스타일입니다.
       ========================================================= */

    .breadcrumb{
      padding-top:28px;
      font-size:13px;
      color:var(--muted);
    }

    .breadcrumb a:hover{color:var(--ink);}
    .breadcrumb-separator{margin:0 7px;color:#B7B8B5;}

    .app-hero{
      display:flex;
      align-items:center;
      gap:24px;
      padding:30px 0 28px;
    }

    .app-icon{
      width:88px;
      height:88px;
      flex:0 0 88px;
      object-fit:contain;
      border:1px solid var(--line);
      border-radius:20px;
      background:var(--surface);
    }

    .app-hero-content{min-width:0;}

    .app-hero h1{
      margin:0 0 8px;
      font-size:clamp(30px,4.2vw,44px);
      font-weight:800;
      letter-spacing:-0.025em;
      line-height:1.2;
    }

    .app-description{
      margin:0 0 13px;
      max-width:700px;
      color:var(--muted);
      font-size:16px;
    }

    .app-meta{
      display:flex;
      flex-wrap:wrap;
      gap:5px 12px;
      color:var(--muted);
      font-size:13px;
    }

    .app-meta-item + .app-meta-item::before{
      content:"·";
      margin-right:12px;
      color:#B7B8B5;
    }

    .app-actions{
      display:flex;
      flex-wrap:wrap;
      gap:9px;
      padding:0 0 46px;
    }

    .app-button{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      min-height:40px;
      padding:9px 16px;
      border:1px solid var(--line);
      border-radius:8px;
      background:var(--surface);
      color:var(--ink);
      font-size:13.5px;
      font-weight:700;
      transition:background .15s,border-color .15s,color .15s;
    }

    .app-button:hover{border-color:#B9B9B5;}

    .app-button.primary{
      background:var(--ink);
      color:var(--paper);
      border-color:var(--ink);
    }

    .app-button.primary:hover{
      background:var(--accent);
      border-color:var(--accent);
    }

    .detail-section{
      border-top:1px solid var(--line);
      padding:48px 0;
    }

    .detail-section h2{
      margin:0 0 15px;
      font-size:21px;
      font-weight:800;
      letter-spacing:-0.01em;
    }

    .detail-content{
      max-width:720px;
      color:var(--muted);
      font-size:14.5px;
    }

    .detail-content p{
      margin:0 0 12px;
    }

    .detail-content p:last-child{margin-bottom:0;}

    .feature-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
      margin-top:20px;
    }

    .feature-card{
      padding:18px;
      border:1px solid var(--line);
      border-radius:12px;
      background:var(--surface);
    }

    .feature-card h3{
      margin:0 0 7px;
      font-size:15px;
      font-weight:800;
    }

    .feature-card p{
      margin:0;
      color:var(--muted);
      font-size:13.5px;
    }

    .steps{
      max-width:720px;
      margin:20px 0 0;
      padding:0;
      list-style:none;
      counter-reset:step;
    }

    .steps li{
      position:relative;
      min-height:26px;
      padding:1px 0 16px 40px;
      color:var(--muted);
      font-size:14px;
    }

    .steps li::before{
      content:counter(step);
      counter-increment:step;
      position:absolute;
      left:0;
      top:0;
      width:26px;
      height:26px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:50%;
      background:var(--ink);
      color:var(--paper);
      font-size:12px;
      font-weight:800;
    }

    .environment{
      max-width:720px;
      margin-top:18px;
      border-top:1px solid var(--line);
    }

    .environment-item{
      display:flex;
      justify-content:space-between;
      gap:20px;
      padding:13px 4px;
      border-bottom:1px solid var(--line);
      font-size:14px;
    }

    .environment-label{color:var(--muted);}
    .environment-value{
      text-align:right;
      font-weight:700;
    }

    .notice-list{
      max-width:820px;
      margin-top:18px;
      border-top:1px solid var(--line);
    }

    .notice-item{
      display:grid;
      grid-template-columns:92px minmax(0,1fr) 18px;
      align-items:center;
      gap:14px;
      padding:14px 4px;
      border-bottom:1px solid var(--line);
      font-size:14px;
    }

    .notice-date{
      color:var(--muted);
      font-size:12.5px;
    }

    .notice-title{
      min-width:0;
      font-weight:700;
    }

    .notice-arrow{
      color:var(--muted);
      text-align:right;
    }

    .notice-item:hover .notice-title{color:var(--accent);}

    .notice-empty{
      padding:24px 4px;
      color:var(--muted);
      font-size:14px;
    }

    .related-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:10px;
      margin-top:20px;
    }

    .related-card{
      display:block;
      padding:17px;
      border:1px solid var(--line);
      border-radius:12px;
      background:var(--surface);
    }

    .related-card:hover{border-color:#B9B9B5;}

    .related-card h3{
      margin:0 0 6px;
      font-size:14.5px;
    }

    .related-card p{
      margin:0;
      color:var(--muted);
      font-size:12.5px;
    }

    .bottom-cta{
      border-top:1px solid var(--line);
      padding:48px 0 56px;
      text-align:center;
    }

    .bottom-cta h2{
      margin:0 0 17px;
      font-size:21px;
      font-weight:800;
    }

    .bottom-cta .app-actions{
      justify-content:center;
      padding-bottom:0;
    }

    .back-link{
      display:inline-flex;
      align-items:center;
      gap:5px;
      margin:0 0 54px;
      color:var(--muted);
      font-size:13.5px;
      font-weight:700;
    }

    .back-link:hover{color:var(--ink);}

    .loading,
    .error-message{
      padding:80px 0;
      text-align:center;
      color:var(--muted);
      font-size:14px;
    }

    .error-message small{
      display:block;
      margin-top:8px;
      color:var(--muted);
    }

    @media (max-width:700px){
      .app-hero{
        align-items:flex-start;
        gap:17px;
      }

      .app-icon{
        width:70px;
        height:70px;
        flex-basis:70px;
        border-radius:16px;
      }

      .feature-grid,
      .related-grid{
        grid-template-columns:1fr;
      }

      .environment{
        max-width:none;
      }
    }

    @media (max-width:500px){
      .breadcrumb{
        padding-top:20px;
        font-size:12px;
      }

      .app-hero{
        display:block;
        padding-top:22px;
      }

      .app-icon{
        margin-bottom:15px;
      }

      .app-description{
        font-size:14.5px;
      }

      .app-actions .app-button{
        flex:1;
      }

      .notice-item{
        grid-template-columns:72px minmax(0,1fr) 14px;
        gap:9px;
      }

      .notice-title{
        font-size:13.5px;
      }

      .environment-item{
        font-size:13.5px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="wrap header-inner">

    <!-- 현재 저장소의 공통 Header 구조를 유지합니다. -->
    <a class="logo" href="../index.html" aria-label="ALPACA TOOLS 메인">
      <img src="../assets/logo.png" alt="ALPACA TOOLS">
      <span>ALPACA TOOLS</span>
    </a>

    <nav aria-label="주요 메뉴">
      <a href="../index.html">홈</a>
      <a href="../tools.html" class="active">모든 도구</a>
      <a href="../notice.html">공지사항</a>
    </nav>

    <a class="gh-btn"
       href="https://github.com/alpaca100-kor/AlpacaTools"
       target="_blank"
       rel="noopener">
      GitHub ↗
    </a>

    <!-- style.css의 모바일 메뉴를 사용하는 경우 필요합니다. -->
    <button class="menu-toggle"
            type="button"
            aria-label="메뉴 열기"
            aria-expanded="false"
            aria-controls="main-nav">
      <span></span>
      <span></span>
      <span></span>
    </button>

  </div>
</header>

<main id="app-detail">
  <div class="wrap">
    <div class="loading">앱 정보를 불러오는 중입니다.</div>
  </div>
</main>

<footer>
  <div class="wrap footer-inner">
    <div>© ALPACA TOOLS</div>
    <div>
      <a href="../index.html">홈</a>
      <a href="../tools.html">모든 도구</a>
      <a href="../notice.html">공지사항</a>
    </div>
  </div>
</footer>

<script>
  /*
   * ==========================================================
   * ALPACA TOOLS 앱 상세페이지 표준 템플릿
   * ==========================================================
   *
   * 사용 방법
   * ----------------------------------------------------------
   * 1. 이 파일을 tools/{id}.html로 복사합니다.
   *
   * 2. 아래 APP_ID를 해당 앱의 apps.json id로 변경합니다.
   *
   *    예)
   *    알파카 달력       → "ac"
   *    알파카 메모장     → "an"
   *    이미지 편집기 WEB → "aie-web"
   *
   * 3. APP_CONTENT의 앱별 콘텐츠를 작성합니다.
   *
   * 앱의 이름, 아이콘, 버전, 플랫폼, GitHub 주소,
   * 실행/다운로드 주소 및 관련 공지사항은 JSON에서 자동으로
   * 가져오기 때문에 상세페이지마다 중복해서 입력하지 않습니다.
   */

  const APP_ID = "ac";

  /*
   * ==========================================================
   * 앱별 상세 콘텐츠
   * ==========================================================
   *
   * 이 부분만 앱마다 수정합니다.
   *
   * intro      : 앱 상세 소개
   * features   : 주요 기능
   * usage      : 사용 방법
   * additional: 추가 안내(선택)
   */

  const APP_CONTENT = {
    intro: `
      <p>알파카 달력은 웹 브라우저에서 월별 또는 1년 전체의 날짜를 간편하게 확인할 수 있도록 만든 달력입니다.</p>
      <p>월별 보기와 연간 보기 사이를 전환할 수 있으며, 현재 날짜를 빠르게 확인하거나 원하는 연도와 월로 이동할 수 있습니다.</p>
      <p>라이트 모드와 다크 모드를 지원하고, 공휴일이 표시되는 날짜에는 관련 정보를 확인할 수 있도록 구성되어 있습니다.</p>
    `,
    features: [
      { title: "월별 달력", description: "한 달의 날짜를 한눈에 확인할 수 있으며 이전 달과 다음 달을 탐색할 수 있습니다." },
      { title: "1년 전체 보기", description: "한 해의 날짜를 연간 달력 형태로 확인할 수 있어 장기적인 일정이나 날짜 확인에 활용할 수 있습니다." },
      { title: "오늘 날짜 바로가기", description: "현재 날짜를 빠르게 확인하고 달력을 오늘 날짜 기준으로 이동할 수 있습니다." },
      { title: "연도·월 이동", description: "연도와 월을 직접 선택하거나 입력하여 원하는 시점의 달력을 확인할 수 있습니다." },
      { title: "공휴일 확인", description: "공휴일이 표시된 날짜를 구분할 수 있으며 해당 날짜를 선택하면 공휴일 정보를 확인할 수 있습니다." },
      { title: "라이트·다크 모드", description: "화면 테마를 라이트 모드와 다크 모드로 전환할 수 있으며 선택한 테마는 저장되어 다시 방문했을 때 적용됩니다." }
    ],
    usage: [
      "알파카 달력 페이지를 열면 현재 날짜를 기준으로 달력이 표시됩니다.",
      "월별 보기에서는 원하는 연도와 월을 선택하거나 이전·다음 달로 이동하여 날짜를 확인합니다.",
      "1년 전체가 필요한 경우 연간 보기로 전환하여 해당 연도의 날짜를 한눈에 확인합니다.",
      "공휴일이 표시된 날짜를 선택하면 해당 공휴일의 정보를 확인할 수 있습니다.",
      "화면 환경에 맞게 테마 버튼을 이용하여 라이트 모드와 다크 모드를 전환할 수 있습니다."
    ],
    additional: `
      <p>알파카 달력은 별도의 프로그램 설치 없이 웹 브라우저에서 사용할 수 있습니다.</p>
      <p>현재 <strong>v1.0</strong>으로 제공되고 있으며, 자세한 소스코드는 GitHub 저장소에서 확인할 수 있습니다.</p>
    `
  };


  /* ==========================================================
     공통 함수
     ========================================================== */

  const $ = (selector) => document.querySelector(selector);

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function formatDate(value) {
    if (!value) return "-";
    return String(value).replace(/-/g, ".");
  }

  function categoryName(category) {
    const names = {
      work: "업무",
      life: "생활",
      developer: "개발자"
    };

    return names[category] || category || "-";
  }

  function platformName(platform) {
    const names = {
      web: "Web",
      windows: "Windows"
    };

    return names[platform] || platform || "-";
  }

  /*
   * platform에 따라 Hero의 대표 버튼을 결정합니다.
   * Web      → 바로 열기
   * Windows → 다운로드
   */
  function getPrimaryAction(app) {
    if (app.platform === "web" && app.url) {
      return {
        text: "바로 열기 ↗",
        url: app.url
      };
    }

    if (app.platform === "windows" && app.downloadUrl) {
      return {
        text: "다운로드 ↗",
        url: app.downloadUrl
      };
    }

    return null;
  }

  /*
   * 관련 도구 링크는 tools.html을 통해 이동합니다.
   * tools.html에서 앱 id를 읽도록 구현하면
   * 특정 앱을 바로 선택하는 것도 가능합니다.
   */
  function getRelatedApps(app, allApps) {
    const sameCategory = allApps
      .filter(item => item.id !== app.id)
      .filter(item => item.category === app.category);

    if (sameCategory.length >= 3) {
      return sameCategory.slice(0, 3);
    }

    return allApps
      .filter(item => item.id !== app.id)
      .slice(0, 3);
  }


  /* ==========================================================
     페이지 렌더링
     ========================================================== */

  function renderPage(app, notices, allApps) {
    document.title = `${app.name} | ALPACA TOOLS`;

    const primary = getPrimaryAction(app);

    const primaryButton = primary
      ? `
        <a class="app-button primary"
           href="${escapeHtml(primary.url)}"
           target="_blank"
           rel="noopener">
          ${escapeHtml(primary.text)}
        </a>
      `
      : "";

    const githubButton = app.github
      ? `
        <a class="app-button"
           href="${escapeHtml(app.github)}"
           target="_blank"
           rel="noopener">
          GitHub ↗
        </a>
      `
      : "";

    /*
     * downloadUrl이 있는 경우 별도의 다운로드 버튼을 제공합니다.
     * 대표 버튼이 Windows 다운로드 버튼인 경우 중복하지 않습니다.
     */
    const secondaryDownloadButton =
      app.downloadUrl && app.platform !== "windows"
        ? `
          <a class="app-button"
             href="${escapeHtml(app.downloadUrl)}"
             target="_blank"
             rel="noopener">
            다운로드 ↗
          </a>
        `
        : "";

    const featuresHtml = (APP_CONTENT.features || [])
      .map(feature => `
        <article class="feature-card">
          <h3>${escapeHtml(feature.title)}</h3>
          <p>${escapeHtml(feature.description)}</p>
        </article>
      `)
      .join("");

    const usageHtml = (APP_CONTENT.usage || [])
      .map(step => `<li>${escapeHtml(step)}</li>`)
      .join("");

    /*
     * notice.json에서 appId가 현재 앱 id와 같은 공지만
     * 가져온 뒤 최신 날짜 순으로 표시합니다.
     */
    const noticesHtml = notices.length
      ? notices.map(notice => `
          <a class="notice-item"
             href="${escapeHtml(notice.url)}"
             target="_blank"
             rel="noopener">
            <span class="notice-date">
              ${escapeHtml(formatDate(notice.date))}
            </span>

            <span class="notice-title">
              ${escapeHtml(notice.title)}
            </span>

            <span class="notice-arrow">↗</span>
          </a>
        `).join("")
      : `
        <div class="notice-empty">
          아직 등록된 관련 공지사항이 없습니다.
        </div>
      `;

    const relatedApps = getRelatedApps(app, allApps);

    const relatedHtml = relatedApps
      .map(item => `
        <a class="related-card"
           href="../tools.html?app=${encodeURIComponent(item.id)}">
          <h3>${escapeHtml(item.name)}</h3>
          <p>${escapeHtml(item.description || "")}</p>
        </a>
      `)
      .join("");

    const additionalHtml = APP_CONTENT.additional
      ? `
        <section class="detail-section">
          <h2>추가 안내</h2>
          <div class="detail-content">
            ${APP_CONTENT.additional}
          </div>
        </section>
      `
      : "";

    $("#app-detail").innerHTML = `
      <div class="wrap">

        <div class="breadcrumb" aria-label="현재 위치">
          <a href="../index.html">ALPACA TOOLS</a>
          <span class="breadcrumb-separator">›</span>
          <a href="../tools.html">모든 도구</a>
          <span class="breadcrumb-separator">›</span>
          <span>${escapeHtml(app.name)}</span>
        </div>


        <!-- =================================================
             앱 기본 정보
             ================================================= -->

        <section class="app-hero">

          <img class="app-icon"
               src="${escapeHtml(app.icon || "")}"
               alt="${escapeHtml(app.name)} 아이콘"
               onerror="this.style.display='none';">

          <div class="app-hero-content">

            <h1>${escapeHtml(app.name)}</h1>

            <p class="app-description">
              ${escapeHtml(app.description || "")}
            </p>

            <div class="app-meta">
              <span class="app-meta-item">
                ${escapeHtml(categoryName(app.category))}
              </span>

              <span class="app-meta-item">
                ${escapeHtml(platformName(app.platform))}
              </span>

              <span class="app-meta-item">
                v${escapeHtml(app.version || "-")}
              </span>

              <span class="app-meta-item">
                ${escapeHtml(formatDate(app.updatedAt))} 업데이트
              </span>
            </div>

          </div>
        </section>


        <!-- =================================================
             주요 버튼
             ================================================= -->

        <div class="app-actions">
          ${primaryButton}
          ${secondaryDownloadButton}
          ${githubButton}
        </div>


        <!-- =================================================

  /* ==========================================================
     JSON 데이터 로드
     ========================================================== */

  async function loadData() {
    try {
      if (!APP_ID || APP_ID === "YOUR_APP_ID") {
        throw new Error("APP_ID를 설정하지 않았습니다.");
      }

      /*
       * 상세페이지는 tools 폴더 안에 있으므로
       * apps.json과 notice.json은 한 단계 위에 있습니다.
       */
      const [appsResponse, noticesResponse] = await Promise.all([
        fetch("../apps.json"),
        fetch("../notice.json")
      ]);

      if (!appsResponse.ok) {
        throw new Error("apps.json을 불러오지 못했습니다.");
      }

      if (!noticesResponse.ok) {
        throw new Error("notice.json을 불러오지 못했습니다.");
      }

      const appsData = await appsResponse.json();
      const noticesData = await noticesResponse.json();

      /*
       * 현재 JSON이
       *
       * { "apps": [...] }
       * { "notices": [...] }
       *
       * 형태인 경우를 기본으로 사용합니다.
       */
      const apps = Array.isArray(appsData)
        ? appsData
        : (appsData.apps || []);

      const notices = Array.isArray(noticesData)
        ? noticesData
        : (noticesData.notices || []);

      const app = apps.find(item => item.id === APP_ID);

      if (!app) {
        throw new Error(
          `apps.json에서 "${APP_ID}" 앱을 찾을 수 없습니다.`
        );
      }

      /*
       * 현재 앱과 연결된 공지만 선택합니다.
       * appId가 null인 공지는 특정 앱 상세페이지에 표시되지 않습니다.
       */
      const relatedNotices = notices
        .filter(notice => notice.appId === APP_ID)
        .sort((a, b) =>
          String(b.date || "").localeCompare(String(a.date || ""))
        );

      renderPage(app, relatedNotices, apps);

    } catch (error) {
      console.error(error);

      $("#app-detail").innerHTML = `
        <div class="wrap">
          <div class="error-message">
            앱 정보를 불러오지 못했습니다.
            <small>${escapeHtml(error.message)}</small>
          </div>
        </div>
      `;
    }
  }


  /* ==========================================================
     모바일 메뉴
     style.css에 정의된 .menu-toggle / nav.nav-open 활용
     ========================================================== */

  const menuToggle = document.querySelector(".menu-toggle");
  const mainNav = document.querySelector("header nav");

  if (menuToggle && mainNav) {
    menuToggle.addEventListener("click", () => {
      const isOpen = mainNav.classList.toggle("nav-open");

      menuToggle.classList.toggle("is-active", isOpen);
      menuToggle.setAttribute("aria-expanded", String(isOpen));
      menuToggle.setAttribute(
        "aria-label",
        isOpen ? "메뉴 닫기" : "메뉴 열기"
      );
    });
  }


  loadData();
</script>
